<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CODEX MACHINAE</title>

    <!-- ============================================================
         NOTA DE UTILIZAÇÃO
         ============================================================
         Esta página é carregada dentro de um <iframe> pelo botão
         Copas (♥️) de Menus.js (ver MODAL_CONTENTS → 'Coracao-modal').
         Não passa pelo injector do index.html — é uma página HTML
         completa e independente, como MENU_GERAL.html.

         FUNCIONAMENTO:
           1. Ao carregar, lê window.ConquistasSistema.listarDesbloqueadas()
              — a lista de IDs salvos em localStorage pelos Codex de
              livros (ex.: CODEX_LIVRO.html).
           2. Para cada ID, busca os dados (nome/descrição/imagem) em
              window.CONQUISTAS_LISTA.
           3. Monta um grid só com as conquistas desbloqueadas — as
              que ainda não foram desbloqueadas simplesmente não
              aparecem (nenhuma silhueta ou placeholder).
           4. Clique numa miniatura abre a imagem em tamanho maior,
              num lightbox simples embutido nesta própria página.

         FECHAR O MODAL:
           O botão "Fechar" envia postMessage({type:'FECHAR_MODAL'})
           para a página pai, que o Menus.js já escuta (ver SEÇÃO 5.1
           de Menus.js) — mesmo padrão usado por IFRAME_MAPA.html.
         ============================================================ -->

    <script src="Sistema_Tema.js"></script>
    <script src="CONQUISTAS_LISTA.js"></script>
    <script src="CONQUISTAS_SISTEMA.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 1.5rem;
            font-family: 'Georgia', 'Times New Roman', serif;
            background-color: var(--bg, #ffffff);
            color: var(--text, #1a1a1a);
            min-height: 100vh;
        }

        /* ============================================================
           CABEÇALHO
           ============================================================ */
        .cm-cabecalho {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            border-bottom: 1px solid var(--borda, #cccccc);
            padding-bottom: 0.75rem;
            margin-bottom: 1.5rem;
        }

        .cm-titulo {
            margin: 0;
            font-size: 1.4rem;
            letter-spacing: 0.04em;
        }

        .cm-contador {
            font-size: 0.85rem;
            opacity: 0.65;
            margin: 0;
        }

        #cm-btn-fechar {
            position: fixed;
            top: 10px;
            right: 12px;
            width: 32px;
            height: 32px;
            border: none;
            background: transparent;
            color: var(--text, #1a1a1a);
            font-size: 1.4rem;
            line-height: 1;
            cursor: pointer;
            opacity: 0.6;
            z-index: 1100;
            transition: opacity 0.2s ease;
        }

        #cm-btn-fechar:hover,
        #cm-btn-fechar:focus-visible {
            opacity: 1;
        }

        /* ============================================================
           GRID DE CONQUISTAS
           ============================================================ */
        .cm-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 16px;
        }

        .cm-item {
            border: 1px solid var(--borda, #cccccc);
            border-radius: 6px;
            overflow: hidden;
            cursor: pointer;
            background: none;
            padding: 0;
            text-align: left;
            font-family: inherit;
            color: inherit;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }

        .cm-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(0,0,0,0.15);
        }

        .cm-item img {
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            display: block;
        }

        .cm-item .cm-nome {
            display: block;
            font-size: 0.8rem;
            padding: 8px 10px;
            border-top: 1px solid var(--borda, #cccccc);
        }

        /* ============================================================
           ESTADO VAZIO
           ============================================================ */
        .cm-vazio {
            text-align: center;
            padding: 3rem 1rem;
            opacity: 0.7;
            font-style: italic;
        }

        /* ============================================================
           LIGHTBOX
           ============================================================ */
        .cm-lightbox {
            position: fixed;
            inset: 0;
            background-color: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            padding: 2rem;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.2s ease, visibility 0.2s ease;
            z-index: 1200;
        }

        .cm-lightbox.aberto {
            opacity: 1;
            visibility: visible;
        }

        .cm-lightbox img {
            max-width: 100%;
            max-height: 70vh;
            border-radius: 4px;
            box-shadow: 0 0 40px rgba(0,0,0,0.8);
            transition: transform 0.2s ease;
            position: relative;
            z-index: 2;
        }

        /* --- Barra de ferramentas: zoom + download ---
           Fica abaixo do título/descrição, em fluxo normal (não mais
           sobreposta à imagem). z-index mais alto que a imagem, para
           permanecer sempre clicável, mesmo com a imagem ampliada. */
        .cm-lightbox-toolbar {
            display: flex;
            gap: 0.6rem;
            position: relative;
            z-index: 3;
        }

        .cm-lightbox-toolbar button,
        .cm-lightbox-toolbar a {
            font-family: inherit;
            font-size: 1.1rem;
            background: none;
            border: 1px solid rgba(240, 240, 240, 0.4);
            color: #f0f0f0;
            width: 34px;
            height: 34px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
            cursor: pointer;
            text-decoration: none;
            line-height: 1;
            transition: background-color 0.2s ease, border-color 0.2s ease;
        }

        .cm-lightbox-toolbar button:hover,
        .cm-lightbox-toolbar a:hover {
            background-color: rgba(255, 255, 255, 0.15);
            border-color: rgba(240, 240, 240, 0.7);
        }

        .cm-lightbox-texto {
            color: #f0f0f0;
            text-align: center;
            max-width: 500px;
            position: relative;
            z-index: 1;
        }

        .cm-lightbox-texto .cm-lb-nome {
            font-size: 1.1rem;
            font-weight: bold;
            margin: 0 0 4px;
        }

        .cm-lightbox-texto .cm-lb-descricao {
            font-size: 0.9rem;
            opacity: 0.8;
            margin: 0;
        }

        .cm-lightbox-fechar {
            position: absolute;
            top: 1.5rem;
            right: 1.5rem;
            font-family: inherit;
            font-size: 0.85rem;
            background: none;
            border: 1px solid rgba(240, 240, 240, 0.4);
            color: #f0f0f0;
            padding: 0.4rem 0.9rem;
            border-radius: 4px;
            cursor: pointer;
            line-height: 1;
            z-index: 4;
            transition: background-color 0.2s ease, border-color 0.2s ease;
        }

        .cm-lightbox-fechar:hover {
            background-color: rgba(255, 255, 255, 0.15);
            border-color: rgba(240, 240, 240, 0.7);
        }
    </style>
</head>
<body>

    <div class="cm-cabecalho">
        <div>
            <h1 class="cm-titulo">CODEX MACHINAE</h1>
            <p class="cm-contador" id="cm-contador"></p>
        </div>
        <button id="cm-btn-fechar" type="button" aria-label="Fechar" title="Fechar">&times;</button>
    </div>

    <div id="cm-grid-wrapper"></div>

    <!-- ============================================================
         LIGHTBOX — reaproveitado para qualquer conquista clicada
         ============================================================ -->
    <div class="cm-lightbox" id="cm-lightbox">
        <button class="cm-lightbox-fechar" id="cm-lightbox-fechar" type="button" aria-label="Fechar imagem">Fechar</button>
        <img id="cm-lightbox-img" src="" alt="">
        <div class="cm-lightbox-texto">
            <p class="cm-lb-nome" id="cm-lightbox-nome"></p>
            <p class="cm-lb-descricao" id="cm-lightbox-descricao"></p>
        </div>
        <div class="cm-lightbox-toolbar">
            <button id="cm-zoom-out" type="button" aria-label="Diminuir zoom" title="Diminuir zoom">−</button>
            <button id="cm-zoom-in" type="button" aria-label="Aumentar zoom" title="Aumentar zoom">+</button>
            <a id="cm-lightbox-download" href="" download title="Descarregar imagem" aria-label="Descarregar imagem">⭳</a>
        </div>
    </div>

    <!-- ============================================================
         SCRIPT — Montagem do grid + lightbox
         ============================================================
         MANUTENÇÃO:
           Nenhuma edição necessária aqui ao adicionar novas
           conquistas — este script lê CONQUISTAS_LISTA.js e o
           localStorage dinamicamente. Basta cadastrar a conquista
           em CONQUISTAS_LISTA.js e o data-conquista no capítulo
           correspondente em CODEX_LIVRO.html.
         ============================================================ -->
    <script>
        (function () {
            'use strict';

            function montarGrid() {
                var wrapper   = document.getElementById('cm-grid-wrapper');
                var contador  = document.getElementById('cm-contador');
                var lista     = window.CONQUISTAS_LISTA || {};
                var sistema   = window.ConquistasSistema;
                var idsSalvos = sistema ? sistema.listarDesbloqueadas() : [];

                /* Filtra apenas IDs desbloqueados que também existem
                   em CONQUISTAS_LISTA.js (evita quebrar caso um ID
                   salvo antigamente tenha sido removido da lista). */
                var desbloqueadas = idsSalvos
                    .filter(function (id) { return !!lista[id]; })
                    .map(function (id) { return Object.assign({ id: id }, lista[id]); });

                contador.textContent = desbloqueadas.length + ' conquista(s) desbloqueada(s)';

                if (desbloqueadas.length === 0) {
                    wrapper.innerHTML = '<p class="cm-vazio">Nenhuma conquista desbloqueada ainda. Continue a leitura para desbloquear ilustrações.</p>';
                    return;
                }

                var grid = document.createElement('div');
                grid.className = 'cm-grid';

                desbloqueadas.forEach(function (conquista) {
                    /* Se a conquista tiver 'imagens' (array), cria um
                       item por imagem; senão, um único item com
                       'imagem', exactamente como antes. */
                    var imagens = conquista.imagens || [conquista.imagem];

                    imagens.forEach(function (img) {
                        var item = document.createElement('button');
                        item.className = 'cm-item';
                        item.type = 'button';
                        item.innerHTML =
                            '<img src="' + img + '" alt="' + conquista.nome + '" loading="lazy">' +
                            '<span class="cm-nome">' + conquista.nome + '</span>';

                        item.addEventListener('click', function () {
                            abrirLightbox(Object.assign({}, conquista, { imagem: img }));
                        });

                        grid.appendChild(item);
                    });
                });

                wrapper.innerHTML = '';
                wrapper.appendChild(grid);
            }

            /* ============================================================
               LIGHTBOX
               ============================================================ */
            var ZOOM_MIN = 1;
            var ZOOM_MAX = 3;
            var ZOOM_PASSO = 0.25;
            var zoomAtual = 1;

            function aplicarZoom() {
                document.getElementById('cm-lightbox-img').style.transform = 'scale(' + zoomAtual + ')';
            }

            function abrirLightbox(conquista) {
                document.getElementById('cm-lightbox-img').src = conquista.imagem;
                document.getElementById('cm-lightbox-img').alt = conquista.nome;
                document.getElementById('cm-lightbox-nome').textContent = conquista.nome;
                document.getElementById('cm-lightbox-descricao').textContent = conquista.descricao;

                /* Zoom reinicia sempre a 1x para cada nova imagem */
                zoomAtual = 1;
                aplicarZoom();

                /* Prepara o link de download com o nome da conquista.
                   NOTA: se a imagem vier de um domínio externo (ex.:
                   Tumblr), o atributo "download" pode ser ignorado pelo
                   navegador por restrição de CORS — nesse caso, o clique
                   abre a imagem numa nova aba em vez de descarregá-la
                   directamente. Para imagens alojadas no próprio site
                   (IMGS/...), o download funciona sempre. */
                var linkDownload = document.getElementById('cm-lightbox-download');
                linkDownload.href = conquista.imagem;
                linkDownload.setAttribute('download', conquista.nome.replace(/\s+/g, '_') + '.jpg');

                document.getElementById('cm-lightbox').classList.add('aberto');
            }

            function fecharLightbox() {
                document.getElementById('cm-lightbox').classList.remove('aberto');
            }

            document.getElementById('cm-zoom-in').addEventListener('click', function () {
                zoomAtual = Math.min(ZOOM_MAX, zoomAtual + ZOOM_PASSO);
                aplicarZoom();
            });

            document.getElementById('cm-zoom-out').addEventListener('click', function () {
                zoomAtual = Math.max(ZOOM_MIN, zoomAtual - ZOOM_PASSO);
                aplicarZoom();
            });

            document.getElementById('cm-lightbox-fechar').addEventListener('click', fecharLightbox);
            document.getElementById('cm-lightbox').addEventListener('click', function (e) {
                if (e.target === this) fecharLightbox();
            });

            /* ============================================================
               FECHAR O MODAL (comunicação com a página pai)
               ============================================================
               Mesmo padrão usado por IFRAME_MAPA.html — ver Menus.js,
               SEÇÃO 5.1, que já escuta esta mensagem.
               ============================================================ */
            document.getElementById('cm-btn-fechar').addEventListener('click', function () {
                window.parent.postMessage({ type: 'FECHAR_MODAL' }, '*');
            });

            /* ============================================================
               INICIALIZAÇÃO
               ============================================================ */
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', montarGrid);
            } else {
                montarGrid();
            }

        }());
    </script>

</body>
</html>
