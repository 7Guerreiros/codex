<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>OPUS MACHINA — Lumina</title>

    <!-- ============================================================
         DEPENDÊNCIAS
         A lista carrega antes do motor.
         O motor reutiliza a instância do pai quando disponível.
         ============================================================ -->
    <script src="Sistema_Tema.js"></script>
    <script src="SISTEMA_LUMINA_CONQUISTAS_LISTA.js"></script>
    <script src="SISTEMA_LUMINA_CONQUISTAS.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 1.5rem;
            font-family: 'Georgia', 'Times New Roman', serif;
            background-color: var(--bg, #ffffff);
            color: var(--text, #1a1a1a);
            min-height: 100vh;
        }

        /* --- Cabeçalho --- */
        .cm-cabecalho {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            border-bottom: 1px solid var(--borda, #cccccc);
            padding-bottom: 0.75rem;
            margin-bottom: 1.5rem;
        }

        .cm-titulo {
            margin: 0;
            font-size: 1.4rem;
            letter-spacing: 0.04em;
        }

        .cm-contador {
            font-size: 0.85rem;
            opacity: 0.65;
            margin: 0;
        }

        #cm-btn-fechar {
            position: fixed;
            top: 10px;
            right: 12px;
            width: 32px;
            height: 32px;
            border: none;
            background: transparent;
            color: var(--text, #1a1a1a);
            font-size: 1.4rem;
            line-height: 1;
            cursor: pointer;
            opacity: 0.6;
            z-index: 1100;
            transition: opacity 0.2s ease;
        }

        #cm-btn-fechar:hover,
        #cm-btn-fechar:focus-visible {
            opacity: 1;
        }

        /* --- Galeria --- */
        .cm-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 16px;
        }

        .cm-item {
            border: 1px solid var(--borda, #cccccc);
            border-radius: 6px;
            overflow: hidden;
            cursor: pointer;
            background: none;
            padding: 0;
            text-align: left;
            font-family: inherit;
            color: inherit;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }

        .cm-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(0,0,0,0.15);
        }

        .cm-item img {
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            display: block;
        }

        .cm-item .cm-nome {
            display: block;
            font-size: 0.8rem;
            padding: 8px 10px;
            border-top: 1px solid var(--borda, #cccccc);
        }

        .cm-vazio {
            text-align: center;
            padding: 3rem 1rem;
            opacity: 0.7;
            font-style: italic;
        }

        /* --- Lightbox --- */
        .cm-lightbox {
            position: fixed;
            inset: 0;
            background-color: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            padding: 2rem;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.2s ease, visibility 0.2s ease;
            z-index: 1200;
        }

        .cm-lightbox.aberto {
            opacity: 1;
            visibility: visible;
        }

        .cm-lightbox img {
            max-width: 100%;
            max-height: 70vh;
            border-radius: 4px;
            box-shadow: 0 0 40px rgba(0,0,0,0.8);
            transition: transform 0.2s ease;
            position: relative;
            z-index: 2;
        }

        .cm-lightbox-toolbar {
            display: flex;
            gap: 0.6rem;
            position: relative;
            z-index: 3;
        }

        .cm-lightbox-toolbar button {
            font-family: inherit;
            font-size: 1.1rem;
            background: none;
            border: 1px solid rgba(240, 240, 240, 0.4);
            color: #f0f0f0;
            width: 34px;
            height: 34px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
            cursor: pointer;
            text-decoration: none;
            line-height: 1;
            transition: background-color 0.2s ease, border-color 0.2s ease;
        }

        .cm-lightbox-toolbar button:hover {
            background-color: rgba(255, 255, 255, 0.15);
            border-color: rgba(240, 240, 240, 0.7);
        }

        .cm-lightbox-texto {
            color: #f0f0f0;
            text-align: center;
            max-width: 500px;
            position: relative;
            z-index: 1;
        }

        .cm-lightbox-texto .cm-lb-nome {
            font-size: 1.1rem;
            font-weight: bold;
            margin: 0 0 4px;
        }

        .cm-lightbox-texto .cm-lb-descricao {
            font-size: 0.9rem;
            opacity: 0.8;
            margin: 0;
        }

        .cm-lightbox-toolbar .cm-lightbox-fechar {
            width: auto;
            padding: 0 0.9rem;
            font-size: 0.85rem;
        }

        /* --- Ajustes locais preservados --- */
        .cm-grid {
            grid-template-columns:
                repeat(auto-fill, minmax(min(140px, 100%), 1fr));
        }

        .cm-cabecalho {
            padding-right: 30px;
        }

        .cm-cabecalho p {
            margin: .35rem 0 0;
        }

        .cm-lightbox {
            height: 100vh;
            height: 100dvh;
        }

        .cm-imagem-area {
            width: 100%;
            min-height: 0;
            flex: 1;
            overflow: auto;
            overscroll-behavior: contain;
        }

        .cm-imagem-area img {
            display: block;
            max-width: none;
            max-height: none;
            height: auto;
            margin: 0 auto;
            transform: none;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        .cm-grid img {
            user-select: none;
            -webkit-touch-callout: none;
        }

        .cm-lightbox.aberto {
            overflow: auto;
            overscroll-behavior: contain;
        }

        .cm-lightbox,
        .cm-imagem-area,
        .cm-lightbox-texto {
            scrollbar-width: none;
        }

        .cm-lightbox::-webkit-scrollbar,
        .cm-imagem-area::-webkit-scrollbar,
        .cm-lightbox-texto::-webkit-scrollbar {
            display: none;
        }

        .cm-imagem-area {
            min-height: 48px;
        }

        .cm-lightbox-texto {
            max-height: 20vh;
            overflow: auto;
            flex-shrink: 0;
        }

        .cm-lightbox-toolbar {
            flex-shrink: 0;
        }

        .cm-item:focus-visible,
        .cm-lightbox button:focus-visible {
            outline: 2px solid currentColor;
            outline-offset: 3px;
        }

        @media (max-width: 480px), (max-height: 420px) {
            .cm-lightbox {
                padding: .75rem;
                gap: .6rem;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .cm-item,
            .cm-lightbox,
            .cm-lightbox img,
            .cm-lightbox-toolbar button,
            #cm-btn-fechar {
                transition: none;
            }
        }

        @media print {
            body {
                visibility: hidden !important;
            }
        }
    </style>
</head>
<body>

    <div class="cm-cabecalho">
        <div>
            <h1 class="cm-titulo">OPUS MACHINA</h1>
            <p>Ilustrações criadas por Lumina</p>
            <p class="cm-contador" id="cm-contador"></p>
        </div>

        <button
            id="cm-btn-fechar"
            type="button"
            aria-label="Fechar"
            title="Fechar"
        >&times;</button>
    </div>

    <div id="cm-grid-wrapper"></div>

    <div
        class="cm-lightbox"
        id="cm-lightbox"
        role="dialog"
        aria-modal="true"
        aria-hidden="true"
        aria-labelledby="cm-lightbox-nome"
        tabindex="-1"
    >
        <div
            class="cm-imagem-area"
            id="cm-imagem-area"
            tabindex="0"
            role="region"
            aria-label="Área da ilustração"
        >
            <img
                id="cm-lightbox-img"
                alt=""
                draggable="false"
            >
        </div>

        <div class="cm-lightbox-texto">
            <p
                class="cm-lb-nome"
                id="cm-lightbox-nome"
            ></p>

            <p
                class="cm-lb-descricao"
                id="cm-lightbox-descricao"
            ></p>
        </div>

        <div class="cm-lightbox-toolbar">
            <button
                id="cm-zoom-out"
                type="button"
                aria-label="Diminuir zoom"
                title="Diminuir zoom"
            >−</button>

            <button
                id="cm-zoom-in"
                type="button"
                aria-label="Aumentar zoom"
                title="Aumentar zoom"
            >+</button>

            <button
                class="cm-lightbox-fechar"
                id="cm-lightbox-fechar"
                type="button"
                aria-label="Fechar imagem"
            >Fechar</button>
        </div>
    </div>

    <script>
    (function () {
        'use strict';

        // ============================================================
        // 1. ELEMENTOS E ESTADO
        // ============================================================

        var wrapper = document.getElementById('cm-grid-wrapper');
        var contador = document.getElementById('cm-contador');
        var lightbox = document.getElementById('cm-lightbox');
        var areaImagem = document.getElementById('cm-imagem-area');
        var imagem = document.getElementById('cm-lightbox-img');
        var fechar = document.getElementById('cm-lightbox-fechar');
        var botaoPainel = document.getElementById('cm-btn-fechar');

        var zoom = 1;
        var imagemBase = 0;
        var retornoFoco = null;
        var rolagemAnterior = '';

        function dadosLista() {
            return (
                window.SistemaLuminaIlustracoes ||
                window.CONQUISTAS_LISTA ||
                {}
            );
        }

        function comReserva(img, principal, reserva) {
            var primeira = principal || reserva;

            img.onerror = function () {
                if (
                    principal &&
                    reserva &&
                    principal !== reserva
                ) {
                    principal = '';
                    img.src = reserva;
                } else {
                    img.alt = 'Ilustração indisponível';
                }
            };

            img.src = primeira;
        }

        // ============================================================
        // 2. GALERIA
        // ============================================================

        function montarGrid() {
            var lista = dadosLista();

            var motor =
                window.SistemaLuminaConquistas ||
                window.ConquistasSistema;

            var chaveFoco = wrapper.contains(
                document.activeElement
            )
                ? document.activeElement
                : retornoFoco;

            chaveFoco = chaveFoco &&
                chaveFoco.getAttribute('data-cm-imagem');

            var focoActualizado = null;

            var tinhaFoco = wrapper.contains(
                document.activeElement
            );

            var ids = (
                motor &&
                typeof motor.listarDesbloqueadas === 'function'
            )
                ? motor.listarDesbloqueadas()
                : null;

            var grid = document.createElement('div');
            grid.className = 'cm-grid';

            var quantidade = 0;

            (ids || []).forEach(function (id) {
                if (
                    !Object.prototype.hasOwnProperty.call(
                        lista,
                        id
                    )
                ) {
                    return;
                }

                var dados = lista[id];

                if (
                    !dados ||
                    typeof dados !== 'object'
                ) {
                    return;
                }

                var imagens = Array.isArray(
                    dados.imagens_principais
                )
                    ? dados.imagens_principais
                    : [dados.imagem_principal];

                var reservas = Array.isArray(
                    dados.imagens_reservas
                )
                    ? dados.imagens_reservas
                    : [dados.imagem_reserva];

                imagens.forEach(function (url, indice) {
                    url = typeof url === 'string'
                        ? url.trim()
                        : '';

                    var reserva =
                        typeof reservas[indice] === 'string'
                            ? reservas[indice].trim()
                            : '';

                    if (!url && !reserva) return;

                    var chave = JSON.stringify(
                        [id, indice]
                    );

                    var item = document.createElement('button');

                    item.type = 'button';
                    item.className = 'cm-item';

                    item.setAttribute(
                        'data-cm-imagem',
                        chave
                    );

                    if (chave === chaveFoco) {
                        focoActualizado = item;
                    }

                    var miniatura = document.createElement('img');

                    miniatura.alt =
                        dados.nome || 'Ilustração de Lumina';

                    miniatura.loading = 'lazy';
                    miniatura.draggable = false;

                    comReserva(
                        miniatura,
                        url,
                        reserva
                    );

                    var nome = document.createElement('span');

                    nome.className = 'cm-nome';
                    nome.textContent = dados.nome || '';

                    item.appendChild(miniatura);
                    item.appendChild(nome);

                    item.addEventListener(
                        'click',
                        function () {
                            abrirLightbox(
                                dados,
                                url,
                                reserva,
                                item
                            );
                        }
                    );

                    grid.appendChild(item);
                    quantidade++;
                });
            });

            contador.textContent =
                quantidade + ' ilustração(ões) disponível(is)';

            wrapper.textContent = '';

            if (quantidade) {
                wrapper.appendChild(grid);
            } else {
                var vazio = document.createElement('p');
                vazio.className = 'cm-vazio';

                vazio.textContent = (
                    ids &&
                    (
                        window.SistemaLuminaIlustracoes ||
                        window.CONQUISTAS_LISTA
                    )
                )
                    ? 'Nenhuma ilustração disponível ainda. Continue a leitura para descobrir as criações de Lumina.'
                    : 'Não foi possível carregar a galeria de ilustrações. Reabra este painel.';

                wrapper.appendChild(vazio);
            }

            if (retornoFoco) {
                retornoFoco = focoActualizado;
            }

            if (tinhaFoco) {
                (focoActualizado || botaoPainel).focus();
            }
        }

        window.addEventListener(
            'storage',
            function (evento) {
                if (
                    evento.key === 'conquistas_desbloqueadas' ||
                    evento.key === null
                ) {
                    montarGrid();
                }
            }
        );

        window.addEventListener(
            'lumina:ilustracoes-alteradas',
            montarGrid
        );

        // ============================================================
        // 3. LIGHTBOX, ZOOM E TECLADO
        // ============================================================

        function aplicarZoom() {
            if (
                !imagemBase ||
                !imagem.naturalWidth
            ) {
                return;
            }

            imagem.style.width =
                (imagemBase * zoom) + 'px';
        }

        function dimensionar() {
            var limiteAltura =
                areaImagem.clientHeight ||
                window.innerHeight * .65;

            var proporcao =
                imagem.naturalWidth /
                (imagem.naturalHeight || 1);

            imagemBase = Math.min(
                imagem.naturalWidth,
                areaImagem.clientWidth,
                limiteAltura * proporcao
            );

            aplicarZoom();
        }

        function abrirLightbox(dados, url, reserva, origem) {
            retornoFoco = origem;
            zoom = 1;
            imagemBase = 0;

            imagem.style.width = '';
            imagem.alt = dados.nome || '';

            document.getElementById(
                'cm-lightbox-nome'
            ).textContent = dados.nome || '';

            document.getElementById(
                'cm-lightbox-descricao'
            ).textContent = dados.descricao || '';

            lightbox.setAttribute(
                'aria-hidden',
                'false'
            );

            lightbox.classList.add('aberto');

            rolagemAnterior = document.body.style.overflow;
            document.body.style.overflow = 'hidden';

            areaImagem.scrollTop = 0;
            areaImagem.scrollLeft = 0;

            imagem.onload = dimensionar;

            comReserva(
                imagem,
                url,
                reserva
            );

            if (
                imagem.complete &&
                imagem.naturalWidth
            ) {
                dimensionar();
            }

            fechar.focus();
        }

        function fecharLightbox() {
            lightbox.classList.remove('aberto');

            document.body.style.overflow =
                rolagemAnterior;

            (
                retornoFoco && retornoFoco.isConnected
                    ? retornoFoco
                    : botaoPainel
            ).focus();

            lightbox.setAttribute(
                'aria-hidden',
                'true'
            );

            imagem.onload = null;
            imagem.onerror = null;
            imagem.removeAttribute('src');

            retornoFoco = null;
        }

        document.getElementById(
            'cm-zoom-in'
        ).addEventListener('click', function () {
            zoom = Math.min(3, zoom + .25);
            aplicarZoom();
        });

        document.getElementById(
            'cm-zoom-out'
        ).addEventListener('click', function () {
            zoom = Math.max(1, zoom - .25);
            aplicarZoom();
        });

        fechar.addEventListener(
            'click',
            fecharLightbox
        );

        lightbox.addEventListener(
            'click',
            function (e) {
                if (e.target === lightbox) {
                    fecharLightbox();
                }
            }
        );

        document.addEventListener(
            'keydown',
            function (e) {
                if (
                    !lightbox.classList.contains('aberto')
                ) {
                    return;
                }

                if (e.key === 'Escape') {
                    e.preventDefault();
                    fecharLightbox();
                } else if (e.key === 'Tab') {
                    var botoes = Array.from(
                        lightbox.querySelectorAll(
                            'button, [tabindex="0"]'
                        )
                    );

                    var primeiro = botoes[0];
                    var ultimo = botoes[botoes.length - 1];

                    if (
                        e.shiftKey &&
                        (
                            document.activeElement === primeiro ||
                            !lightbox.contains(document.activeElement)
                        )
                    ) {
                        e.preventDefault();
                        ultimo.focus();
                    } else if (
                        !e.shiftKey &&
                        (
                            document.activeElement === ultimo ||
                            !lightbox.contains(document.activeElement)
                        )
                    ) {
                        e.preventDefault();
                        primeiro.focus();
                    }
                }
            }
        );

        window.addEventListener(
            'resize',
            function () {
                if (
                    lightbox.classList.contains('aberto')
                ) {
                    dimensionar();
                }
            }
        );

        // ============================================================
        // 4. CÓPIA CASUAL E FECHAMENTO
        // ============================================================

        function imagemProtegida(alvo) {
            return (
                alvo &&
                alvo.tagName === 'IMG' &&
                (
                    wrapper.contains(alvo) ||
                    lightbox.contains(alvo)
                )
            );
        }

        document.addEventListener(
            'contextmenu',
            function (e) {
                if (imagemProtegida(e.target)) {
                    e.preventDefault();
                }
            }
        );

        document.addEventListener(
            'dragstart',
            function (e) {
                if (imagemProtegida(e.target)) {
                    e.preventDefault();
                }
            }
        );

        botaoPainel.addEventListener(
            'click',
            function () {
                if (window.parent === window) return;

                var destino =
                    window.location.protocol === 'file:'
                        ? '*'
                        : window.location.origin;

                window.parent.postMessage(
                    { type: 'FECHAR_MODAL' },
                    destino
                );
            }
        );

        if (document.readyState === 'loading') {
            document.addEventListener(
                'DOMContentLoaded',
                montarGrid,
                { once: true }
            );
        } else {
            montarGrid();
        }
    })();
    </script>

</body>
</html>
