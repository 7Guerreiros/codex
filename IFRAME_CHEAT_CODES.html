<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHEAT CODES</title>

    <!-- ============================================================
         NOTA DE UTILIZAÇÃO
         ============================================================
         Esta página é feita para ser carregada dentro de um
         <iframe> a partir de um modal de Menus.js (mesmo padrão de
         IFRAME_CODEX_MACHINAE.html e IFRAME_MAPA.html). Ligada ao botão de cheats em MODAL_CONTENTS de Menus.js.

         FUNCIONAMENTO:
           1. Utilizador digita um código e confirma (Enter ou botão).
           2. Esta página apenas repassa o texto para
              window.CheatCodes.verificar(texto), definido em
              SISTEMA_LUMINA_CHEATS.js. Toda a comparação (case-insensitive) e
              a execução do script do cheat acontecem lá dentro —
              esta página não sabe nada sobre os códigos existentes.
           3. verificar() devolve o nome ou uma Promise (sucesso), ou null
              (código inválido); esta página só exibe o resultado.
           4. O campo é limpo após cada tentativa, para permitir
              digitar vários códigos em sequência, um atrás do outro.

         FECHAR O MODAL:
           O botão "Fechar" envia postMessage({type:'FECHAR_MODAL'})
           para a página pai — mesmo padrão de IFRAME_CODEX_MACHINAE.html
           (Menus.js já escuta esta mensagem, SEÇÃO 5.1).
         ============================================================ -->

    <script src="Sistema_Tema.js"></script>
    <script src="SISTEMA_LUMINA_CONSQUISTAS_LISTA.js"></script>
    <script src="SISTEMA_LUMINA_CONQUISTAS.js"></script>
    <script src="SISTEMA_LUMINA_CHEATS.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 1.5rem;
            font-family: 'Georgia', 'Times New Roman', serif;
            background-color: var(--bg, #ffffff);
            color: var(--text, #1a1a1a);
            min-height: 100vh;
        }

        /* ============================================================
           CABEÇALHO
           ============================================================ */
        .cc-cabecalho {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            border-bottom: 1px solid var(--borda, #cccccc);
            padding-bottom: 0.75rem;
            margin-bottom: 1.5rem;
        }

        .cc-titulo {
            margin: 0;
            font-size: 1.4rem;
            letter-spacing: 0.04em;
        }

        #cc-btn-fechar {
            position: fixed;
            top: 10px;
            right: 12px;
            width: 32px;
            height: 32px;
            border: none;
            background: transparent;
            color: var(--text, #1a1a1a);
            font-size: 1.4rem;
            line-height: 1;
            cursor: pointer;
            opacity: 0.6;
            z-index: 1100;
            transition: opacity 0.2s ease;
        }

        #cc-btn-fechar:hover,
        #cc-btn-fechar:focus-visible {
            opacity: 1;
        }

        /* ============================================================
           CAIXA DE DIGITAÇÃO
           ============================================================ */
        .cc-form {
            display: flex;
            gap: 10px;
            margin-bottom: 1rem;
        }

        .cc-input {
            flex: 1;
            font-family: inherit;
            font-size: 1rem;
            padding: 0.6rem 0.8rem;
            border: 1px solid var(--borda, #cccccc);
            border-radius: 4px;
            background-color: var(--bg, #ffffff);
            color: var(--text, #1a1a1a);
            letter-spacing: 0.06em;
        }

        .cc-input:focus {
            outline: 2px solid var(--text, #1a1a1a);
            outline-offset: 1px;
        }

        .cc-btn {
            font-family: inherit;
            font-size: 0.95rem;
            padding: 0.6rem 1.2rem;
            border: 1px solid var(--borda, #cccccc);
            border-radius: 4px;
            background-color: var(--text, #1a1a1a);
            color: var(--bg, #ffffff);
            cursor: pointer;
            transition: opacity 0.2s ease;
        }

        .cc-btn:hover {
            opacity: 0.85;
        }

        /* ============================================================
           MENSAGEM DE FEEDBACK
           ============================================================ */
        .cc-feedback {
            min-height: 1.4em;
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
        }

        .cc-feedback.sucesso {
            color: #2e7d32;
        }

        .cc-feedback.erro {
            color: #b3261e;
        }

    </style>

    <!-- NÚCLEO DE LUMINA — estilos isolados. Não alteram o formulário ou tema.
         MANUTENÇÃO: largura máxima em .cc-nucleo; desenho único em qualquer ecrã. -->
    <style id="cc-nucleo-estilos">
        /* O formulário ocupa a sua altura natural; o SVG cobre integralmente o resto, sem deixar faixas vazias.
           preserveAspectRatio="xMidYMin slice" garante o desenho inteiro.
           Ecrãs excepcionalmente baixos mantêm rolagem para alcançar o conjunto. */
        /* Sem margem inferior: o mecanismo termina na própria borda do iframe. */
        body { display: flex; flex-direction: column; height: 100vh; height: 100dvh; padding-bottom: 0; }
        .cc-cabecalho, .cc-form, .cc-feedback { flex-shrink: 0; position: relative; z-index: 2; background: var(--bg, #fff); }
        .cc-cabecalho { isolation: isolate; }
        .cc-input { min-width: 0; }
        .cc-btn { flex-shrink: 0; }
        .cc-nucleo-palco { display: flex; justify-content: center; flex: 1 1 0;
            width: calc(100% + 2rem); min-height: 120px; margin: -65px -1rem 0; }
        .cc-nucleo { position: relative; overflow: hidden; width: 100%; max-width: none; height: 100%; min-height: 120px; }
        .cc-nucleo svg { position: absolute; inset: 0; display: block; width: 100%; height: 100%; }
        @media (max-width: 768px) {
            .cc-nucleo-palco { margin-top: -12px; }
        }
        .cc-core-led { opacity: .85; }
        .cc-core-confirmado .cc-core-led { animation: cc-core-luz .9s ease-out; }
        .cc-core-engasgo svg { animation: cc-core-tremer .38s linear; }
        @keyframes cc-core-luz { 0%,100% { opacity: .85; } 25% { opacity: .15; } 55% { opacity: 1; } }
        @keyframes cc-core-tremer { 0%,100% { transform: translate(0,0); } 20%,60% { transform: translate(1px,0); } 40%,80% { transform: translate(-1px,.5px); } }
        @media (max-width: 480px) {
            body { padding: 1rem 1rem 0; }
            .cc-form { gap: 8px; }
        }
        .cc-nucleo .lm-rotor { transform-origin: 0 0;
            animation: cc-nucleo-girar var(--cycle,40s) linear infinite;
            animation-direction: var(--sens,normal); animation-play-state: paused; }
        .cc-nucleo.cc-nucleo-activo .lm-rotor { animation-play-state: running; }
        .cc-nucleo .lm-signal { opacity: .65; }
        @keyframes cc-nucleo-girar { to { transform: rotate(360deg); } }
        @media (prefers-reduced-motion: reduce) {
            .cc-nucleo .lm-rotor, .cc-core-confirmado .cc-core-led, .cc-core-engasgo svg { animation: none; }
        }
    </style>
</head>
<body>

    <div class="cc-cabecalho">
        <h1 class="cc-titulo">SISTEMA LUMINA: CHEAT CODES</h1>
        <button id="cc-btn-fechar" type="button" aria-label="Fechar" title="Fechar">&times;</button>

    <form class="cc-form" id="cc-form" autocomplete="off">

            type="text"
            placeholder="Digite o Cheat Code..."
            aria-label="Código secreto">
        <button class="cc-btn" type="submit">ACTIVAR</button>
    </form>

    <!-- ============================================================
         SCRIPT — Comparação e execução dos cheats
         ============================================================
         MANUTENÇÃO:
           Nenhuma edição necessária aqui ao adicionar novos cheats
           — basta cadastrar em SISTEMA_LUMINA_CHEATS.js. Este script apenas
           chama window.CheatCodes.verificar(texto) dinamicamente.
         ============================================================ -->
    <script>
        (function () {
            'use strict';

            var form      = document.getElementById('cc-form');
            var input     = document.getElementById('cc-input');
            var feedback  = document.getElementById('cc-feedback');

            /* Mensagem de arranque única: o primeiro resultado substitui-a.
               MANUTENÇÃO: acrescentar variantes apenas nesta lista. */
            var mensagensCore = [
                'Lumina Core iniciado.', 'Lumina Core em funcionamento.',
                'Lumina Core pronto para receber comandos.', 'Terminal Lumina Core carregado.',
                'Lumina Core: núcleo ativado.', 'Lumina Core, entre com o código.',
                'Lumina Core: aguardando senha.', 'Lumina Core: terminal em espera, entre com o comando.'
            ];
            feedback.textContent = mensagensCore[Math.floor(Math.random() * mensagensCore.length)];

            function mostrarFeedback(texto, tipo) {
                feedback.textContent = texto;
                feedback.className = 'cc-feedback ' + tipo;
                window.dispatchEvent(new CustomEvent('lumina:core-resposta', {
                    detail: { sucesso: tipo === 'sucesso' }
                }));
            }

            /* Um pedido de cada vez. A execução começa directamente no evento
               para preservar a abertura de guias pelos cheats existentes.
               Promise.resolve aguarda também os cheats assíncronos.
               O X permanece independente e disponível durante a execução. */
            var executando = false;
            form.addEventListener('submit', function (e) {
                e.preventDefault();
                if (executando) return;
                var digitado = input.value.trim();
                if (!digitado) return;
                var motor = window.SistemaLuminaCheats || window.CheatCodes;
                if (!motor || typeof motor.verificar !== 'function') {
                    mostrarFeedback('O sistema de cheats não foi carregado. Reabra este painel.', 'erro');

                    return;
                }
                executando = true;
                form.setAttribute('aria-busy', 'true');
                function concluir() {
                    executando = false;
                    form.removeAttribute('aria-busy');
                    /* Preserva outro código que tenha sido escrito entretanto. */
                    if (input.value.trim() === digitado) input.value = '';
                    if (document.activeElement === input || form.contains(document.activeElement)) {
                        input.focus();
                    }
                }
                function falhar(erro) {
                    mostrarFeedback('Não foi possível executar o código. ' +
                        (erro && erro.message ? erro.message : 'Tente novamente.'), 'erro');

                    concluir();
                }
                var resultado;
                try { resultado = motor.verificar(digitado); }
                catch (erro) { falhar(erro); return; }
                Promise.resolve(resultado).then(function (nomeCheat) {
                    if (nomeCheat) {
                        mostrarFeedback('Código ativado: ' + nomeCheat, 'sucesso');

                    } else {
                        mostrarFeedback('Código inválido.', 'erro');

                    }
                    concluir();
                }, falhar);
            });

            /* ============================================================
               FECHAR O MODAL (comunicação com a página pai)
               ============================================================ */
            document.getElementById('cc-btn-fechar').addEventListener('click', function () {
                window.parent.postMessage({ type: 'FECHAR_MODAL' }, '*');
            });

        }());
    </script>


    <!-- Pausa sem reiniciar a rotação. Sem ciclo JavaScript por frame. -->
    <script id="cc-nucleo-actividade">
        (function () {
            'use strict';
            var motor = document.querySelector('.cc-nucleo');
            var visivel = true, temporizadores = [], animacoes = [];
            var reduzir = window.matchMedia('(prefers-reduced-motion: reduce)');
            /* Só consulta animações quando há uma resposta; não há ciclo por frame.
               updatePlaybackRate preserva a fase. Nunca se muda animation-duration. */
            function velocidade(valor) {
                animacoes.forEach(function (a) {
                    if (typeof a.updatePlaybackRate === 'function') a.updatePlaybackRate(valor);
                });
            }
            function limpar() {
                temporizadores.forEach(clearTimeout);
                temporizadores.length = 0;
                velocidade(1);
                motor.classList.remove('cc-core-confirmado', 'cc-core-engasgo');
            }
            function depois(ms, tarefa) { temporizadores.push(setTimeout(tarefa, ms)); }
            function actualizar() {
                var activo = visivel && !document.hidden;
                motor.classList.toggle('cc-nucleo-activo', activo);
                if (!activo || reduzir.matches) limpar();
            }
            window.addEventListener('lumina:core-resposta', function (evento) {
                limpar();
                if (!visivel || document.hidden || reduzir.matches) return;
                animacoes = [];
                motor.querySelectorAll('.lm-rotor').forEach(function (roda) {
                    if (typeof roda.getAnimations === 'function') {
                        roda.getAnimations().forEach(function (a) { animacoes.push(a); });
                    }
                });
                var sucesso = !!(evento.detail && evento.detail.sucesso);
                motor.classList.add(sucesso ? 'cc-core-confirmado' : 'cc-core-engasgo');
                if (sucesso) {
                    velocidade(1.5);
                    depois(120, function () { velocidade(2.2); });
                    depois(450, function () { velocidade(1.8); });
                    depois(700, function () { velocidade(1.35); });
                    depois(950, limpar);
                } else {
                    velocidade(.15);
                    depois(130, function () { velocidade(.6); });
                    depois(260, function () { velocidade(.25); });
                    depois(400, limpar);
                }
            });
            document.addEventListener('visibilitychange', actualizar);
            if (reduzir.addEventListener) reduzir.addEventListener('change', actualizar);
            if ('IntersectionObserver' in window) {
                new IntersectionObserver(function (entradas) {
                    visivel = entradas[0].isIntersecting;
                    actualizar();
                }).observe(motor);
            }
            actualizar();
        }());
    </script>
