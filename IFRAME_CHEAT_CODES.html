<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHEAT CODES</title>

    <!-- ============================================================
         NOTA DE UTILIZAÇÃO
         ============================================================
         Esta página é feita para ser carregada dentro de um
         <iframe> a partir de um modal de Menus.js (mesmo padrão de
         IFRAME_CODEX_MACHINAE.html e IFRAME_MAPA.html). Ainda não
         está ligada a nenhum botão — para ativar, adicione uma
         entrada em MODAL_CONTENTS (Menus.js) apontando para este
         ficheiro, associada ao botão desejado.

         FUNCIONAMENTO:
           1. Utilizador digita um código e confirma (Enter ou botão).
           2. Esta página apenas repassa o texto para
              window.CheatCodes.verificar(texto), definido em
              CHEAT_CODES.js. Toda a comparação (case-insensitive) e
              a execução do script do cheat acontecem lá dentro —
              esta página não sabe nada sobre os códigos existentes.
           3. verificar() devolve o nome do cheat (sucesso) ou null
              (código inválido); esta página só exibe o resultado.
           4. O campo é limpo após cada tentativa, para permitir
              digitar vários códigos em sequência, um atrás do outro.

         FECHAR O MODAL:
           O botão "Fechar" envia postMessage({type:'FECHAR_MODAL'})
           para a página pai — mesmo padrão de IFRAME_CODEX_MACHINAE.html
           (Menus.js já escuta esta mensagem, SEÇÃO 5.1).
         ============================================================ -->

    <script src="Sistema_Tema.js"></script>
    <script src="CONQUISTAS_LISTA.js"></script>
    <script src="CONQUISTAS_SISTEMA.js"></script>
    <script src="CHEAT_CODES.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 1.5rem;
            font-family: 'Georgia', 'Times New Roman', serif;
            background-color: var(--bg, #ffffff);
            color: var(--text, #1a1a1a);
            min-height: 100vh;
        }

        /* ============================================================
           CABEÇALHO
           ============================================================ */
        .cc-cabecalho {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            border-bottom: 1px solid var(--borda, #cccccc);
            padding-bottom: 0.75rem;
            margin-bottom: 1.5rem;
        }

        .cc-titulo {
            margin: 0;
            font-size: 1.4rem;
            letter-spacing: 0.04em;
        }

        #cc-btn-fechar {
            position: fixed;
            top: 10px;
            right: 12px;
            width: 32px;
            height: 32px;
            border: none;
            background: transparent;
            color: var(--text, #1a1a1a);
            font-size: 1.4rem;
            line-height: 1;
            cursor: pointer;
            opacity: 0.6;
            z-index: 1100;
            transition: opacity 0.2s ease;
        }

        #cc-btn-fechar:hover,
        #cc-btn-fechar:focus-visible {
            opacity: 1;
        }

        /* ============================================================
           CAIXA DE DIGITAÇÃO
           ============================================================ */
        .cc-form {
            display: flex;
            gap: 10px;
            margin-bottom: 1rem;
        }

        .cc-input {
            flex: 1;
            font-family: inherit;
            font-size: 1rem;
            padding: 0.6rem 0.8rem;
            border: 1px solid var(--borda, #cccccc);
            border-radius: 4px;
            background-color: var(--bg, #ffffff);
            color: var(--text, #1a1a1a);
            letter-spacing: 0.06em;
        }

        .cc-input:focus {
            outline: 2px solid var(--text, #1a1a1a);
            outline-offset: 1px;
        }

        .cc-btn {
            font-family: inherit;
            font-size: 0.95rem;
            padding: 0.6rem 1.2rem;
            border: 1px solid var(--borda, #cccccc);
            border-radius: 4px;
            background-color: var(--text, #1a1a1a);
            color: var(--bg, #ffffff);
            cursor: pointer;
            transition: opacity 0.2s ease;
        }

        .cc-btn:hover {
            opacity: 0.85;
        }

        /* ============================================================
           MENSAGEM DE FEEDBACK
           ============================================================ */
        .cc-feedback {
            min-height: 1.4em;
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
        }

        .cc-feedback.sucesso {
            color: #2e7d32;
        }

        .cc-feedback.erro {
            color: #b3261e;
        }

        /* ============================================================
           HISTÓRICO DE TENTATIVAS (só desta sessão)
           ============================================================ */
        .cc-historico-titulo {
            font-size: 0.8rem;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            opacity: 0.6;
            margin: 0 0 0.5rem;
        }

        .cc-historico {
            list-style: none;
            margin: 0;
            padding: 0;
            font-size: 0.85rem;
            max-height: 160px;
            overflow-y: auto;
        }

        .cc-historico li {
            padding: 0.35rem 0;
            border-bottom: 1px solid var(--borda, #cccccc);
            opacity: 0.8;
        }

        .cc-historico li:last-child {
            border-bottom: none;
        }
    </style>
</head>
<body>

    <div class="cc-cabecalho">
        <h1 class="cc-titulo">CHEAT CODES</h1>
        <button id="cc-btn-fechar" type="button" aria-label="Fechar" title="Fechar">&times;</button>
    </div>

    <form class="cc-form" id="cc-form" autocomplete="off">
        <input
            class="cc-input"
            id="cc-input"
            type="text"
            placeholder="Digite um código..."
            aria-label="Código secreto">
        <button class="cc-btn" type="submit">Ativar</button>
    </form>

    <p class="cc-feedback" id="cc-feedback" role="status" aria-live="polite"></p>

    <div id="cc-historico-wrapper" hidden>
        <p class="cc-historico-titulo">Histórico desta sessão</p>
        <ul class="cc-historico" id="cc-historico"></ul>
    </div>

    <!-- ============================================================
         SCRIPT — Comparação e execução dos cheats
         ============================================================
         MANUTENÇÃO:
           Nenhuma edição necessária aqui ao adicionar novos cheats
           — basta cadastrar em CHEAT_CODES.js. Este script apenas
           chama window.CheatCodes.verificar(texto) dinamicamente.
         ============================================================ -->
    <script>
        (function () {
            'use strict';

            var form      = document.getElementById('cc-form');
            var input     = document.getElementById('cc-input');
            var feedback  = document.getElementById('cc-feedback');
            var historico = document.getElementById('cc-historico');
            var historicoWrapper = document.getElementById('cc-historico-wrapper');

            function mostrarFeedback(texto, tipo) {
                feedback.textContent = texto;
                feedback.className = 'cc-feedback ' + tipo;
            }

            function registarHistorico(codigoDigitado, sucesso, nome) {
                historicoWrapper.hidden = false;

                var item = document.createElement('li');
                item.textContent = sucesso
                    ? '✓ "' + codigoDigitado + '" — ' + nome
                    : '✕ "' + codigoDigitado + '" — código inválido';

                historico.insertBefore(item, historico.firstChild);
            }

            form.addEventListener('submit', function (e) {
                e.preventDefault();

                var digitado = input.value.trim();
                if (!digitado) return;

                /* Toda a comparação e execução acontece dentro de
                   CHEAT_CODES.js — esta página só envia o texto e
                   mostra o resultado. */
                var nomeCheat = window.CheatCodes
                    ? window.CheatCodes.verificar(digitado)
                    : null;

                if (nomeCheat) {
                    mostrarFeedback('Código ativado: ' + nomeCheat, 'sucesso');
                    registarHistorico(digitado, true, nomeCheat);
                } else {
                    mostrarFeedback('Código inválido.', 'erro');
                    registarHistorico(digitado, false, null);
                }

                /* Limpa o campo para permitir digitar o próximo código */
                input.value = '';
                input.focus();
            });

            /* ============================================================
               FECHAR O MODAL (comunicação com a página pai)
               ============================================================ */
            document.getElementById('cc-btn-fechar').addEventListener('click', function () {
                window.parent.postMessage({ type: 'FECHAR_MODAL' }, '*');
            });

        }());
    </script>

</body>
</html>
