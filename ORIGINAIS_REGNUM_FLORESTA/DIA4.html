<!-- ================================================================
     SCRIPT DE VERIFICAÇÃO — NÃO EDITAR
     ================================================================
     FUNCIONAMENTO:
       Este bloco só executa se este arquivo for aberto AVULSO
       (directamente pela URL, ou através de um buscador). Quando
       este arquivo é injectado normalmente pelo Codex Blog (via
       innerHTML), scripts não executam — comportamento padrão dos
       navegadores — por isso este bloco fica inerte e inofensivo
       no fluxo normal do site.

       Ao executar (fora de contexto), procura a variável
       window.SITE_CHAVE_VERIFICACAO, definida apenas dentro do
       index.html. Se não encontrar o valor esperado, conclui que
       a página não está a ser vista dentro do site e redirecciona
       imediatamente para a home.

     MANUTENÇÃO:
       • CHAVE_ESPERADA tem de ser idêntica à definida em index.html.
       • CAMINHO_HOME é relativo a partir da localização deste
         arquivo. Ajustar se a estrutura de pastas do site mudar
         (actualmente presume-se um nível de profundidade, ex:
         BLOG/ARQUIVO_BASE.html).
     ================================================================ -->
<script>
(function () {
    'use strict';

    var CHAVE_ESPERADA = "7Guerreiros_Codigo_Verificacao_Umbra69";
    var CAMINHO_HOME    = "../index.html";

    if (window.SITE_CHAVE_VERIFICACAO !== CHAVE_ESPERADA) {
        window.location.replace(CAMINHO_HOME);
    }
}());
</script>
<!-- ================================================================
     FIM DO SCRIPT DE VERIFICAÇÃO
     ================================================================ -->

<!-- ================================================================
     AVISO DE CONTEXTO — Só visível se aberto avulso
     ================================================================
     FUNCIONAMENTO:
       Por padrão (.fr-aviso-avulso) fica escondido — estado seguro,
       assume-se injetado. O selector "body > .fr-aviso-avulso" só
       combina quando ESTE elemento é filho DIRETO do <body> — o que
       só acontece quando o ficheiro é aberto isoladamente (o browser
       cria <html>/<body> implícitos e este bloco vira filho direto
       deles). Quando injetado dentro do Codex Blog, este elemento
       fica sempre a várias camadas de profundidade do <body> real
       do site, então a regra nunca combina e o aviso permanece
       escondido.

     IMPORTANTE:
       Este bloco (style + p) tem de ficar FORA da .fr-conteudo,
       como irmão dela — nunca dentro — senão o "body >" nunca
       vai combinar mesmo no caso avulso.
     ================================================================ -->
<style>
    .fr-aviso-avulso { display: none; }

    body > .fr-aviso-avulso {
        display: block;
        margin-top: 2em;
        padding-top: 1em;
        border-top: 1px solid #999;
        font-style: italic;
        font-size: 0.9em;
    }
</style>

<p class="fr-aviso-avulso">
