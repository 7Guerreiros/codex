<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>7Guerreiros</title>
    <meta name="description" content="Contos, livros e RPGs em Twine por Prompt &amp; Papel. Ficção e jogos narrativos feitos à mão.">

    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%99%A0%3C/text%3E%3C/svg%3E">

    <!-- Estilos unificados do site. -->
    <link rel="stylesheet" href="Estilo.css">

    <!-- Identifica os conteúdos carregados dentro do site. -->
    <script>
        window.SITE_CHAVE_VERIFICACAO =
            "7Guerreiros_Codigo_Verificacao_Umbra69";
    </script>
</head>
<body>
    <nav id="site-nav" aria-label="Navegação principal"></nav>

    <main>
        <section class="area-conteudo"></section>
    </main>

    <!-- Componentes e sistemas existentes. -->
    <script src="Banner.js" defer></script>
    <script src="Rodape.js" defer></script>
    <script src="Sistema_Tema.js"></script>
    <script src="Menus.js" defer></script>
    <script src="LOADING.js" defer></script>
    <script src="Popups.js"></script>
	<script src="Easter_Egg.js" defer></script>

    <!-- Preserva o último Codex e capítulo abertos. -->
    <script src="ULTIMO_CODEX.js" defer></script>

    <!--
        INJETOR DE CODEX
        - Carrega o conteúdo na área principal.
        - Executa scripts na ordem.
        - Restaura a posição inicial.
        - Recupera o CODEX_ALPHA em caso de falha.
        - Notifica os sistemas pelo evento site:codex-injetado.
    -->
    <script>
(function () {
    'use strict';

    var CODEX_PADRAO = 'CODEX_ALPHA.html';
    var navegacao = 0;
    var requisicao = null;

    // Uma nova navegação invalida respostas anteriores.
    async function injectarCodex(arquivo, inicial) {
        var area = document.querySelector('.area-conteudo');

        if (!area) return false;

        var numero = ++navegacao;

        if (requisicao) {
            requisicao.abort();
        }

        var controller = new AbortController();
        requisicao = controller;

        async function carregar(caminho, restaurar) {
            var limite = setTimeout(function () {
                controller.abort();
            }, 15000);

            try {
                var resposta = await fetch(caminho, {
                    signal: controller.signal
                });

                if (!resposta.ok) {
                    throw new Error(
                        'Falha ao carregar: ' + caminho
                    );
                }

                var html = await resposta.text();

                if (numero !== navegacao) return false;

                var doc = new DOMParser().parseFromString(
                    html,
                    'text/html'
                );

                var componente = doc.body.firstElementChild;

                if (!componente ||
                    /^(SCRIPT|STYLE|LINK|META)$/.test(
                        componente.tagName
                    )) {
                    throw new Error(
                        'Componente inválido: ' + caminho
                    );
                }

                area.innerHTML = '';
                area.dataset.codexArquivo = caminho;
                area.appendChild(
                    document.adoptNode(componente)
                );

                // Reativa scripts na ordem, aguardando os externos.
                for (var antigo of Array.from(
                    area.querySelectorAll('script')
                )) {
                    if (numero !== navegacao) return false;

                    var novo = document.createElement('script');

                    Array.from(antigo.attributes).forEach(
                        function (attr) {
                            novo.setAttribute(
                                attr.name,
                                attr.value
                            );
                        }
                    );

                    novo.textContent = antigo.textContent;

                    var pronto = novo.src
                        ? new Promise(function (resolve, reject) {
                            novo.onload = resolve;

                            novo.onerror = function () {
                                if (novo.hasAttribute(
                                    'data-opcional'
                                )) {
                                    console.warn(
                                        '[INJECTOR] Script opcional indisponível:',
                                        novo.src
                                    );
                                    resolve();
                                } else {
                                    reject(new Error(
                                        'Script indisponível: ' +
                                        novo.src
                                    ));
                                }
                            };

                            controller.signal.addEventListener(
                                'abort',
                                function () {
                                    reject(new Error(
                                        'Carregamento interrompido'
                                    ));
                                },
                                { once: true }
                            );
                        })
                        : Promise.resolve();

                    antigo.replaceWith(novo);
                    await pronto;
                }

                clearTimeout(limite);

                if (numero !== navegacao) return false;

                if (restaurar && window.SistemaPosicao) {
                    await window.SistemaPosicao.restaurar(
                        area,
                        caminho
                    );
                }

                if (numero !== navegacao) return false;

                window.dispatchEvent(new CustomEvent(
                    'site:codex-injetado',
                    {
                        detail: {
                            arquivo: caminho,
                            inicial: inicial === true
                        }
                    }
                ));

                return true;
            } finally {
                clearTimeout(limite);
            }
        }

        try {
            return await carregar(
                arquivo || CODEX_PADRAO,
                inicial === true
            );
        } catch (erro) {
            if (numero !== navegacao) return false;

            console.warn(
                '[INJECTOR] Recuperando o Alpha:',
                erro
            );

            controller.abort();
            controller = new AbortController();
            requisicao = controller;

            // Recuperação única, sem restaurar o capítulo que falhou.
            try {
                return await carregar(CODEX_PADRAO, false);
            } catch (falhaAlpha) {
                if (numero !== navegacao) return false;

                console.error(
                    '[INJECTOR] Alpha indisponível:',
                    falhaAlpha
                );

                area.innerHTML =
                    '<p>Não foi possível carregar o CODEX_ALPHA. ' +
                    'Verifique a conexão e recarregue a página.</p>';

                return false;
            }
        }
    }

    window.injectarCodex = injectarCodex;

    document.addEventListener('DOMContentLoaded', function () {
        var arquivo = window.SistemaPosicao
            ? window.SistemaPosicao.codexInicial()
            : CODEX_PADRAO;

        window.injectarCodex(arquivo, true);
    });
}());
    </script>
</body>
</html>
