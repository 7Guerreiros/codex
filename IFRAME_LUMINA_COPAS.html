/* =====================================================================
   1. APRESENTAÇÃO LIMPA — coração e fundo, sem controlos externos ou legendas.
   MANUTENÇÃO: fundo/texto usam --bg e --text, para a futura integração de tema.
   Nenhuma dependência do site, armazenamento, rede ou sistema de cheats.
   ===================================================================== */
*{box-sizing:border-box}
:root{--bg:#fff;--text:#222;color-scheme:light dark}
@media(prefers-color-scheme:dark){:root{--bg:#1a1a1a;--text:#f0f0f0}}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text)}
.cardia-palco{position:relative;isolation:isolate;width:100%;height:100vh;height:100dvh;min-height:260px;overflow:hidden;display:flex;align-items:center;justify-content:center}
.cardia-modelo{position:relative;z-index:1;width:100%;height:100%;max-width:1100px;min-height:0}
.cardia-modelo>svg{display:block;width:100%;height:100%;overflow:hidden}
/* 2. Mecânica original: eixos CSS e bielas sincronizadas em JS. */
.rotor{transform-origin:0 0;animation:girar var(--ciclo,35s) linear infinite;animation-direction:var(--sentido,normal)}
@keyframes girar{to{transform:rotate(360deg)}}
/* 3. Duplo batimento: ligeira expansão global e excursão das câmaras. */
.cardia-pulso{transform-origin:500px 460px;animation:cardia-bater 2.8s ease-in-out infinite}
@keyframes cardia-bater{0%,15%,35%,100%{transform:scale(1)}6%{transform:scale(1.026)}24%{transform:scale(1.016)}}
.camara-e{animation:pulsar-e 2.8s ease-in-out infinite}.camara-d{animation:pulsar-d 2.8s ease-in-out infinite}
.luz-pulso{animation:pulsar-luz 2.8s ease-in-out infinite}
@keyframes pulsar-e{0%,15%,35%,100%{transform:translate(0,0)}6%,24%{transform:translate(-3.3px,1.5px)}}
@keyframes pulsar-d{0%,15%,35%,100%{transform:translate(0,0)}6%,24%{transform:translate(3.3px,1.5px)}}
@keyframes pulsar-luz{0%,15%,35%,100%{opacity:.4}6%,24%{opacity:1}}
/* 4. Blindagens: esconder a peça visual, conservar o alvo de toque/teclado. */
.cardia-placa-visual{pointer-events:none;transition:opacity .3s ease}
.cardia-placa-aberta .cardia-placa-visual{opacity:0}
.cardia-placa-area{pointer-events:all;cursor:pointer;outline:none}
.cardia-placa-area:focus-visible{stroke:#b6eaff;stroke-width:3}
/* 5. Suspensão fora de vista e acessibilidade. */
body.suspenso .rotor,body.suspenso .camara,body.suspenso .luz-pulso,body.suspenso .cardia-pulso,body.suspenso .cc-sombra-giro{animation-play-state:paused}
@media(prefers-reduced-motion:reduce){.rotor,.camara,.luz-pulso,.cardia-pulso{animation:none}.cardia-placa-visual{transition:none}}

  if(pai){

   Object.keys(cores).forEach(function(chave){var valor=estilo.getPropertyValue(chave).trim();if(valor)cores[chave]=valor;});
  }
  Object.keys(cores).forEach(function(chave){if(raiz.style.getPropertyValue(chave)!==cores[chave])raiz.style.setProperty(chave,cores[chave]);});
  raiz.style.colorScheme=escuro?'dark':'light';
 }

<script>(function(){
 'use strict';
 const corpo=document.body;
 // Placas individuais. A forma transparente mantém a área clicável aberta.
 const areas=document.querySelectorAll('.cardia-placa-area');
 function ligar(area){
  function alternar(){
   const aberta=area.parentNode.classList.toggle('cardia-placa-aberta');
   area.setAttribute('aria-pressed',String(aberta));
   area.setAttribute('aria-label',(aberta?'Repor ':'Retirar ')+'blindagem '+area.getAttribute('data-placa'));
  }
  area.addEventListener('click',alternar);
  area.addEventListener('keydown',function(evento){
   if(evento.key==='Enter'||evento.key===' '){evento.preventDefault();alternar();}
  });
 }
 for(let i=0;i<areas.length;i++)ligar(areas[i]);
 // 5. Cinemática de biela-manivela: r=18, L=110, eixo do cilindro vertical.
 // Um único relógio alimenta rodas, pinos, bielas e êmbolos dos dois conjuntos.
 const pecas=[320,680].map(function(cx,i){function obter(nome){return document.getElementById(nome+'-'+i);}return {cx:cx,fase:i*Math.PI,roda:obter('roda'),sec:obter('secundaria'),pino:obter('pino'),biela:obter('biela'),sombra:obter('biela-sombra'),embolo:obter('embolo')};});
 const preferencia=window.matchMedia('(prefers-reduced-motion: reduce)');
 let visivel=true,raf=0,anterior=null,tempo=0;
 function desenhar(){const angulo=tempo/4800*Math.PI*2;
  pecas.forEach(function(p){const a=angulo+p.fase,dx=18*Math.cos(a),dy=18*Math.sin(a),px=p.cx+dx,py=360+dy,sy=py+Math.sqrt(110*110-dx*dx),graus=a*180/Math.PI;
   p.roda.setAttribute('transform','rotate('+graus+')');p.sec.setAttribute('transform','rotate('+(-graus*32/22+8)+')');p.pino.setAttribute('cx',px);p.pino.setAttribute('cy',py);
   [p.biela,p.sombra].forEach(function(b){b.setAttribute('x1',px);b.setAttribute('y1',py);b.setAttribute('x2',p.cx);b.setAttribute('y2',sy);});p.embolo.setAttribute('transform','translate('+p.cx+' '+sy+')');
  });
 }
 function permitido(){return !document.hidden&&visivel&&!preferencia.matches;}
 function tick(agora){raf=0;if(!permitido()){anterior=null;return;}if(anterior!==null)tempo+=Math.min(agora-anterior,50);anterior=agora;desenhar();raf=requestAnimationFrame(tick);}
 function actualizar(){corpo.classList.toggle('suspenso',document.hidden||!visivel);if(!permitido()){if(raf)cancelAnimationFrame(raf);raf=0;anterior=null;}else if(!raf){anterior=null;raf=requestAnimationFrame(tick);}}
 document.addEventListener('visibilitychange',actualizar);
 if(preferencia.addEventListener)preferencia.addEventListener('change',actualizar);else if(preferencia.addListener)preferencia.addListener(actualizar);
 if('IntersectionObserver' in window){const observador=new IntersectionObserver(function(entradas){entradas.forEach(function(e){visivel=e.isIntersecting;});actualizar();});observador.observe(document.querySelector('.cardia-palco'));}
 desenhar();actualizar();
})();</script>

<script>
(function(){
 'use strict';
 var fundo=document.getElementById('cc-sombras-rodas'),modelo=document.querySelector('.cardia-modelo svg');
 var rodas=fundo.querySelectorAll('.cc-sombra-posicao'),pendente=0;
 function desenhar(){
  pendente=0;
  var f=fundo.getBoundingClientRect(),m=modelo.getBoundingClientRect();
  if(!f.width||!f.height||!m.height)return;
  fundo.setAttribute('viewBox','0 0 '+f.width+' '+f.height);
  var topo=m.top-f.top,altura=m.height,compacto=f.width<=600;
  // Tamanhos adaptados à janela; as rodas das bordas continuam fora dela.
  var escala=Math.max(.30,Math.min(1.75,Math.max(f.width/1050,altura/620)));
  for(var i=0;i<rodas.length;i++){
   var roda=rodas[i],r=Number(roda.getAttribute('data-linha')),c=Number(roda.getAttribute('data-coluna'));
   var x=f.width*(c/7)+(r%2?f.width/30:-f.width/40);
   if(compacto)x=f.width*(c/6)+(r%2?12:-12);
   var y=topo+altura*(r/5)+((c%2)?altura/30:-altura/40);
   var tamanho=escala*(1+((r+c)%3)*.12);
   roda.setAttribute('transform','translate('+x+' '+y+') scale('+tamanho+')');
  }
 }
 function agendar(){if(!pendente)pendente=requestAnimationFrame(desenhar);}
 function pausa(){fundo.classList.toggle('cc-sombras-pausadas',document.hidden);}
 window.addEventListener('resize',agendar);window.addEventListener('load',agendar);document.addEventListener('visibilitychange',pausa);
 if(window.ResizeObserver){var observador=new ResizeObserver(agendar);observador.observe(fundo);observador.observe(modelo);}
 if(document.fonts&&document.fonts.ready)document.fonts.ready.then(agendar);
 agendar();pausa();
})();
</script>
