<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CODEX LIVRO</title>

    <!-- ============================================================
         NOTA DE UTILIZAÇÃO
         ============================================================
         Este ficheiro foi concebido para funcionar de dois modos:

         MODO AUTÓNOMO (standalone):
           Abrir directamente no browser para testes.
           Os estilos do <head> garantem uma aparência funcional.

         MODO INJECTADO (uso normal no site):
           O injector da página pai deve:
             1. Fazer fetch() deste ficheiro
             2. Extrair o innerHTML de <div class="codex-livro">
             3. Injectá-lo na .area-conteudo
             4. Recriar os scripts manualmente (ver documentação
                do injector) e chamar: window.initCodexLivro()

         IMPORTANTE: o <head> e o <body> são ignorados na injecção.
         Apenas o conteúdo dentro de .codex-livro é usado.
         ============================================================ -->

    <style>
        /* Estilos mínimos apenas para visualização standalone.
           São descartados na injecção — o pai fornece o seu próprio layout. */
        body {
            margin: 0;
            padding: 20px;
        }
    </style>
</head>
<body>

<!-- ================================================================
     CODEX LIVRO — Componente injectável
     ================================================================
     ESTRUTURA DO COMPONENTE:
       .codex-livro                → wrapper raiz e âncora de todo o CSS/JS
         <style>                  → CSS 100% escopado (prefixo .codex-livro)
         <script src="CONQUISTAS_LISTA.js">   → dados das conquistas (ver ficheiro próprio)
         <script src="CONQUISTAS_SISTEMA.js"> → motor de desbloqueio + popup (ver ficheiro próprio)
         .cb-container            → container de largura e padding
           .cb-assunto            → grupo de tópicos (repetível)
             .cb-titulo           → título do grupo
             .cb-topico           → item accordion
               [data-arquivo]     → caminho do ficheiro a injectar
               [data-conquista]   → ID da conquista deste capítulo (ver CONQUISTAS_LISTA.js)
               .cb-topico-btn     → botão clicável (acessível)
               .cb-topico-conteudo → área de conteúdo injectado
         <script>                 → lógica escopada em IIFE

     DIFERENÇA EM RELAÇÃO AO CODEX_BLOG.html:
       Este Codex é a base para os LIVROS do site — a única adição
       estrutural é o atributo data-conquista em cada .cb-topico,
       mais os dois <script src> das conquistas logo acima. O resto
       (accordion, fetch, cache, ARIA) é idêntico ao CODEX_BLOG.html.
       CODEX_BLOG.html não foi alterado e não tem sistema de conquistas.

     MANUTENÇÃO — ADICIONAR CAPÍTULOS:
       Duplicar o bloco .cb-topico e actualizar:
         - data-arquivo: caminho relativo ao index.html da página pai
         - data-conquista: ID único, no padrão LIVRO-CAPXX-NN
           (ver convenção completa em CONQUISTAS_LISTA.js)
         - Texto do .cb-topico-btn
       Não esquecer de cadastrar o mesmo ID em CONQUISTAS_LISTA.js,
       com nome, descrição e imagem — senão o capítulo abre
       normalmente, mas nenhuma conquista é exibida (aviso no console).

     MANUTENÇÃO — ADICIONAR GRUPOS (livros/partes):
       Duplicar o bloco .cb-assunto inteiro.

     MANUTENÇÃO — CAMINHOS:
       Os caminhos em data-arquivo, assim como os <script src> das
       conquistas, são sempre relativos ao index.html da página pai,
       não a este ficheiro.
     ================================================================ -->

<div class="codex-livro">

    <!-- ============================================================
         SCRIPTS DO SISTEMA DE CONQUISTAS
         ============================================================
         Carregados apenas por Codex que usam conquistas (como este).
         O injector do index.html recria estes <script src> ao
         injectar o componente, então eles são buscados e executados
         normalmente — nenhuma alteração no index.html é necessária.
         ============================================================ -->
    <script src="CONQUISTAS_LISTA.js"></script>
    <script src="CONQUISTAS_SISTEMA.js"></script>

    <!-- ============================================================
         ESTILOS — Totalmente escopados a .codex-livro
         ============================================================
         REGRA CRÍTICA: nenhum selector aqui começa sem .codex-livro
         Isto garante que ao ser injectado, nenhum estilo
         "vaza" para o resto da página pai.

         SISTEMA DE TEMAS:
         As variáveis --cb-bg, --cb-text e --cb-borda herdam directamente
         das variáveis globais --bg, --text e --borda definidas e geridas
         pelo Sistema_Tema.js do pai (aplicadas em :root e html.tema-escuro).
         As variáveis internas (hover, activo, muted) são definidas aqui
         em dois estados: claro (.codex-livro) e escuro (html.tema-escuro
         .codex-livro), espelhando o selector exacto do Sistema_Tema.js.
         O @media (prefers-color-scheme) foi removido — o pai já trata
         da preferência do sistema e evita conflitos.
         ============================================================ -->
    <style>

        /* --- Modo Claro (padrão) --- */
        /* --cb-bg, --cb-text, --cb-borda herdam as variáveis globais do
           Sistema_Tema.js. Os valores após a vírgula são fallback standalone. */
        .codex-livro {
            --cb-bg:        var(--bg,   #ffffff);
            --cb-text:      var(--text, #1a1a1a);
            --cb-borda:     var(--borda,#cccccc);
            --cb-bg-topico: #f9f9f9;
            --cb-bg-hover:  #eeeeee;
            --cb-bg-ativo:  #e0e0e0;
            --cb-muted:     #888888;
        }

        /* --- Modo Escuro via Sistema_Tema.js (classe aplicada em <html>) ---
           Selector espelha exactamente o do Sistema_Tema.js: html.tema-escuro
           As variáveis base (bg, text, borda) já são actualizadas pelo pai;
           apenas as variáveis internas precisam de ser redefinidas aqui.     */
        html.tema-escuro .codex-livro {
            --cb-bg-topico: #2a2a2a;
            --cb-bg-hover:  #3a3a3a;
            --cb-bg-ativo:  #404040;
            --cb-muted:     #999999;
        }

        /* --- Container principal --- */
        .codex-livro .cb-container {
            max-width: 100%;
            padding: 0;
            font-family: 'Georgia', 'Times New Roman', serif;
            font-size: 1rem;
            line-height: 1.7;
            color: var(--cb-text);
        }

        @media (min-width: 769px) {
            .codex-livro .cb-container {
                padding: 0 20px;
            }
        }

        /* --- Grupo de tópicos (.cb-assunto) --- */
        .codex-livro .cb-assunto {
            margin-bottom: 35px;
            padding: 0 10px;
        }

        .codex-livro .cb-titulo {
            font-size: 1.5rem;
            font-weight: bold;
            margin-bottom: 20px;
            padding: 15px 20px;
            border-bottom: 1px solid var(--cb-borda);
            color: var(--cb-text);
            letter-spacing: 0.5px;
        }

        @media (max-width: 768px) {
            .codex-livro .cb-titulo {
                font-size: 1.3rem;
                padding: 12px 16px;
            }
        }

        /* --- Item accordion (.cb-topico) --- */
        .codex-livro .cb-topico {
            margin-bottom: 5px;
            border-radius: 4px;
            overflow: hidden;
            border: 1px solid var(--cb-borda);
        }

        /* --- Botão do cabeçalho --- */
        .codex-livro .cb-topico-btn {
            display: block;
            width: 100%;
            padding: 16px 20px;
            background-color: var(--cb-bg-topico);
            border: none;
            text-align: left;
            font-family: 'Georgia', 'Times New Roman', serif;
            font-size: 1.1rem;
            font-weight: normal;
            color: var(--cb-text);
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .codex-livro .cb-topico-btn:hover {
            background-color: var(--cb-bg-hover);
        }

        /* Estado expandido: botão activo */
        .codex-livro .cb-topico.expandido .cb-topico-btn {
            background-color: var(--cb-bg-ativo);
            font-weight: bold;
        }

        @media (max-width: 768px) {
            .codex-livro .cb-topico-btn {
                padding: 14px 16px;
                font-size: 1rem;
            }
        }

        /* --- Painel de conteúdo --- */
        /* Fechado por padrão; aberto pela classe .expandido no pai */
        .codex-livro .cb-topico-conteudo {
            display: none;
            padding: 20px;
            background-color: var(--cb-bg);
            color: var(--cb-text);
        }

        .codex-livro .cb-topico.expandido .cb-topico-conteudo {
            display: block;
        }

        @media (max-width: 768px) {
            .codex-livro .cb-topico-conteudo {
                padding: 16px;
            }
        }

        /* --- Indicador de carregamento --- */
        .codex-livro .cb-carregando {
            margin: 0;
            padding: 8px 0;
            font-style: italic;
            font-size: 0.9rem;
            color: var(--cb-muted);
        }

        /* --- Estilos para conteúdo injectado dentro dos tópicos ---
           Estes estilos aplicam-se ao HTML carregado via fetch.
           Adicionar aqui quaisquer regras que os ficheiros de conteúdo
           devam herdar automaticamente. */
        .codex-livro .cb-topico-conteudo p {
            margin-bottom: 16px;
            text-align: justify;
            font-size: 1.05rem;
        }

        .codex-livro .cb-topico-conteudo h1,
        .codex-livro .cb-topico-conteudo h2,
        .codex-livro .cb-topico-conteudo h3 {
            margin: 20px 0 10px;
            color: var(--cb-text);
        }

        .codex-livro .cb-topico-conteudo img {
            max-width: 100%;
            height: auto;
            margin: 15px 0;
            border: 1px solid var(--cb-borda);
            border-radius: 4px;
        }

    </style>


    <!-- ============================================================
         CONTEÚDO
         ============================================================
         COMO ADICIONAR UM TÓPICO:
           1. Duplicar o bloco <!-- TÓPICO abaixo
           2. Alterar data-arquivo para o caminho do ficheiro
           3. Alterar o texto do botão

         COMO ADICIONAR UM GRUPO:
           1. Duplicar o bloco .cb-assunto inteiro
           2. Alterar o texto de .cb-titulo
         ============================================================ -->
    <div class="cb-container">

        <div class="cb-assunto">
            <div class="cb-titulo">REGNUM FLORESTAE</div>

            <!-- TÓPICO -->
            <!-- data-arquivo:   caminho relativo ao index.html da página pai -->
            <!-- data-conquista: ID cadastrado em CONQUISTAS_LISTA.js -->
            <div class="cb-topico" data-arquivo="LIVROS/REGNUM_FLORESTAE/CAP01.html" data-conquista="REGN-CAP01-01">
                <button class="cb-topico-btn" aria-expanded="false">
                    Capítulo 1 — Primeiro Exemplo, Apenas Testes.
                </button>
                <div class="cb-topico-conteudo" role="region" aria-hidden="true"></div>
            </div>

            <!-- TÓPICO -->
            <div class="cb-topico" data-arquivo="BLOG/ARQUIVO_BASE.html" data-conquista="REGN-CAP02-01">
                <button class="cb-topico-btn" aria-expanded="false">
                    Capítulo 1 — Segundo Exemplo, Apenas Testes.
                </button>
                <div class="cb-topico-conteudo" role="region" aria-hidden="true"></div>
            </div>
			<div class="cb-topico" data-arquivo="BLOG/ARQUIVO_BASE.html" data-conquista="REGN-CAP02-02">
                <button class="cb-topico-btn" aria-expanded="false">
                    Capítulo 2 — Segundo Exemplo, Apenas Testes.
                </button>
                <div class="cb-topico-conteudo" role="region" aria-hidden="true"></div>
            </div>

        </div><!-- /.cb-assunto -->

    </div><!-- /.cb-container -->


    <!-- ============================================================
         SCRIPT — Accordion com fetch interno
         ============================================================
         FUNCIONAMENTO:
           1. Clique no botão → fecha todos os tópicos abertos
           2. Se o tópico clicado já estava aberto → apenas fecha (toggle)
           3. Se o conteúdo ainda não foi carregado → fetch do ficheiro
              indicado em data-arquivo no .cb-topico pai
           4. Conteúdo já carregado → reabre sem novo fetch (cache natural)
           5. Estado ARIA actualizado em cada acção (acessibilidade)

         COMPATIBILIDADE COM INJECÇÃO:
           O script expõe window.initCodexLivro() para ser chamado
           pelo injector da página pai APÓS a injecção do HTML.
           A guarda btn.dataset.iniciado evita registar o mesmo
           listener mais de uma vez (seguro para re-injecções).

           O injector deve chamar: window.initCodexLivro()
           Se o injector recriar os scripts via cloneNode,
           a auto-inicialização no final do script trata de tudo.

         ENCAPSULAMENTO:
           Todo o código está dentro de uma IIFE com 'use strict'.
           Nenhuma variável escapa para o escopo global,
           excepto a função initCodexLivro exposta intencionalmente.
         ============================================================ -->
    <script>
        (function () {
            'use strict';

            /* Inicializa o accordion dentro de .codex-livro.
               Seguro para ser chamado múltiplas vezes (idempotente). */
            function initCodexLivro() {
                var container = document.querySelector('.codex-livro');
                if (!container) return; /* Sai silenciosamente se não encontrar */

                var carregando = new Set(); /* Evita fetches duplicados simultâneos */

                container.querySelectorAll('.cb-topico-btn').forEach(function (btn) {

                    /* Guarda contra duplo registo de listener em re-injecções */
                    if (btn.dataset.iniciado === 'true') return;
                    btn.dataset.iniciado = 'true';

                    btn.addEventListener('click', function () {
                        var topico    = this.closest('.cb-topico');
                        var conteudo  = topico.querySelector('.cb-topico-conteudo');
                        var arquivo   = topico.getAttribute('data-arquivo');
                        var conquista = topico.getAttribute('data-conquista');
                        var aberto    = topico.classList.contains('expandido');

                        /* Fecha todos os tópicos */
                        fecharTodos(container);

                        /* Toggle: se já estava aberto, apenas fecha */
                        if (aberto) return;

                        /* ====================================================
                           SISTEMA DE CONQUISTAS (adição incremental)
                           ====================================================
                           Dispara a cada abertura de capítulo. desbloquear()
                           é idempotente — se o ID já estiver salvo, não faz
                           nada e não reexibe o popup (silencioso após a
                           primeira vez). Guarda de existência evita erro
                           caso os scripts de conquista não tenham carregado. */
                        if (conquista && window.ConquistasSistema) {
                            window.ConquistasSistema.desbloquear(conquista);
                        }

                        /* Conteúdo já carregado: apenas expande */
                        if (conteudo.dataset.carregado === 'true') {
                            expandir(topico, btn, conteudo);
                            return;
                        }

                        /* Conteúdo novo: fetch + expande */
                        carregarConteudo(arquivo, conteudo, topico, btn, carregando);
                    });
                });
            }

            /* Fecha todos os tópicos e actualiza ARIA */
            function fecharTodos(container) {
                container.querySelectorAll('.cb-topico').forEach(function (t) {
                    t.classList.remove('expandido');
                    t.querySelector('.cb-topico-btn')
                     .setAttribute('aria-expanded', 'false');
                    t.querySelector('.cb-topico-conteudo')
                     .setAttribute('aria-hidden', 'true');
                });
            }

            /* Expande um tópico e actualiza ARIA */
            function expandir(topico, btn, conteudo) {
                topico.classList.add('expandido');
                btn.setAttribute('aria-expanded', 'true');
                conteudo.setAttribute('aria-hidden', 'false');
            }

            /* Carrega o ficheiro via fetch e injeta no painel */
            function carregarConteudo(arquivo, conteudoDiv, topico, btn, carregando) {
                if (carregando.has(arquivo)) return; /* Bloqueia fetch duplicado */
                carregando.add(arquivo);

                /* Mostra indicador e expande antes do fetch terminar */
                conteudoDiv.innerHTML = '<p class="cb-carregando">A carregar\u2026</p>';
                expandir(topico, btn, conteudoDiv);

                fetch(arquivo)
                    .then(function (resposta) {
                        if (!resposta.ok) {
                            throw new Error('Ficheiro não encontrado: ' + arquivo);
                        }
                        return resposta.text();
                    })
                    .then(function (html) {
                        conteudoDiv.innerHTML = html;
                        conteudoDiv.dataset.carregado = 'true'; /* Marca como em cache */
                        carregando.delete(arquivo);
                    })
                    .catch(function (erro) {
                        console.error('[CODEX LIVRO]', erro);
                        conteudoDiv.innerHTML = '<p>Conte\u00fado n\u00e3o dispon\u00edvel.</p>';
                        conteudoDiv.dataset.carregado = 'true'; /* Evita retry infinito */
                        carregando.delete(arquivo);
                    });
            }

            /* Expõe initCodexLivro globalmente para o injector da página pai.
               O injector deve chamar window.initCodexLivro() após a injecção. */
            window.initCodexLivro = initCodexLivro;

            /* Auto-inicialização quando usado em modo standalone */
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', initCodexLivro);
            } else {
                initCodexLivro();
            }

        }());
    </script>

</div><!-- /.codex-livro -->

</body>
</html>
