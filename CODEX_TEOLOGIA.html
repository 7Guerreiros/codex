<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CODEX THEOLOGIA</title>
    <style>body { margin: 0; padding: 20px; }</style>
</head>
<body>
<!-- ================================================================
     CONFIGURAÇÃO — editar somente 0/1 e o número da aparência.
     conquistas: 0 desliga; 1 activa a integração existente.
     leitor: 0 desliga; 1 carrega o futuro SISTEMA_LUMINA_LEITOR.js.
     aparência: 1 acordeão; 2 linha do tempo; 3 reservada. Não implementada: usa 1.
     ULTIMO_CODEX continua activo independentemente destes sistemas.
     IDs data-conquista identificam capítulos para ambos os sistemas.
     ================================================================ -->
<div class="codex-blog" data-codex-zero data-conquistas="0" data-leitor="0" data-aparencia="1">
    <!-- BLOCO 1 — APARÊNCIA 1: CSS. Aparências 2 e 3: blocos reservados. -->
    <style>


        /* --- Modo Claro (padrão) --- */
        /* --cb-bg, --cb-text, --cb-borda herdam as variáveis globais do
           Sistema_Tema.js. Os valores após a vírgula são fallback standalone. */
        .codex-blog[data-aparencia="1"] {
            --cb-bg:        var(--bg,   #ffffff);
            --cb-text:      var(--text, #1a1a1a);
            --cb-borda:     var(--borda,#cccccc);
            --cb-bg-topico: #f9f9f9;
            --cb-bg-hover:  #eeeeee;
            --cb-bg-ativo:  #e0e0e0;
            --cb-muted:     #888888;
        }

        /* --- Modo Escuro via Sistema_Tema.js (classe aplicada em <html>) ---
           Selector espelha exactamente o do Sistema_Tema.js: html.tema-escuro
           As variáveis base (bg, text, borda) já são actualizadas pelo pai;
           apenas as variáveis internas precisam de ser redefinidas aqui.     */
        html.tema-escuro .codex-blog[data-aparencia="1"] {
            --cb-bg-topico: #2a2a2a;
            --cb-bg-hover:  #3a3a3a;
            --cb-bg-ativo:  #404040;
            --cb-muted:     #999999;
        }

        /* --- Container principal --- */
        .codex-blog[data-aparencia="1"] .cb-container {
            max-width: 100%;
            padding: 0;
            font-family: 'Georgia', 'Times New Roman', serif;
            font-size: 1rem;
            line-height: 1.7;
            color: var(--cb-text);
        }

        @media (min-width: 769px) {
            .codex-blog[data-aparencia="1"] .cb-container {
                padding: 0 20px;
            }
        }

        /* --- Grupo de tópicos (.cb-assunto) --- */
        .codex-blog[data-aparencia="1"] .cb-assunto {
            margin-bottom: 35px;
            padding: 0 10px;
        }

        .codex-blog[data-aparencia="1"] .cb-titulo {
            font-size: 1.5rem;
            font-weight: bold;
            margin-bottom: 20px;
            padding: 15px 20px;
            border-bottom: 1px solid var(--cb-borda);
            color: var(--cb-text);
            letter-spacing: 0.5px;
        }

        @media (max-width: 768px) {
            .codex-blog[data-aparencia="1"] .cb-titulo {
                font-size: 1.3rem;
                padding: 12px 16px;
            }
        }

        /* --- Item accordion (.cb-topico) --- */
        .codex-blog[data-aparencia="1"] .cb-topico {
            margin-bottom: 5px;
            border-radius: 4px;
            overflow: hidden;
            border: 1px solid var(--cb-borda);
        }

        /* --- Botão do cabeçalho --- */
        .codex-blog[data-aparencia="1"] .cb-topico-btn {
            display: block;
            width: 100%;
            padding: 16px 20px;
            background-color: var(--cb-bg-topico);
            border: none;
            text-align: left;
            font-family: 'Georgia', 'Times New Roman', serif;
            font-size: 1.1rem;
            font-weight: normal;
            color: var(--cb-text);
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .codex-blog[data-aparencia="1"] .cb-topico-btn:hover {
            background-color: var(--cb-bg-hover);
        }

        /* Estado expandido: botão activo */
        .codex-blog[data-aparencia="1"] .cb-topico.expandido .cb-topico-btn {
            background-color: var(--cb-bg-ativo);
            font-weight: bold;
        }

        @media (max-width: 768px) {
            .codex-blog[data-aparencia="1"] .cb-topico-btn {
                padding: 14px 16px;
                font-size: 1rem;
            }
        }

        /* --- Painel de conteúdo --- */
        /* Fechado por padrão; aberto pela classe .expandido no pai */
        .codex-blog[data-aparencia="1"] .cb-topico-conteudo {
            display: none;
            padding: 20px;
            background-color: var(--cb-bg);
            color: var(--cb-text);
        }

        .codex-blog[data-aparencia="1"] .cb-topico.expandido .cb-topico-conteudo {
            display: block;
        }

        @media (max-width: 768px) {
            .codex-blog[data-aparencia="1"] .cb-topico-conteudo {
                padding: 16px;
            }
        }

        /* --- Indicador de carregamento --- */
        .codex-blog[data-aparencia="1"] .cb-carregando {
            margin: 0;
            padding: 8px 0;
            font-style: italic;
            font-size: 0.9rem;
            color: var(--cb-muted);
        }

        /* --- Estilos para conteúdo injectado dentro dos tópicos ---
           Estes estilos aplicam-se ao HTML carregado via fetch.
           Adicionar aqui quaisquer regras que os ficheiros de conteúdo
           devam herdar automaticamente. */
        .codex-blog[data-aparencia="1"] .cb-topico-conteudo p {
            margin-bottom: 16px;
            text-align: justify;
            font-size: 1.05rem;
        }

        .codex-blog[data-aparencia="1"] .cb-topico-conteudo h1,
        .codex-blog[data-aparencia="1"] .cb-topico-conteudo h2,
        .codex-blog[data-aparencia="1"] .cb-topico-conteudo h3 {
            margin: 20px 0 10px;
            color: var(--cb-text);
        }

        .codex-blog[data-aparencia="1"] .cb-topico-conteudo img {
            max-width: 100%;
            height: auto;
            margin: 15px 0;
            border: 1px solid var(--cb-borda);
            border-radius: 4px;
        }

        /* --- Capa + Sinopse (.cb-capa) ---
           Bloco introdutório do livro, exibido acima da lista de
           capítulos. Desktop: capa à esquerda, sinopse à direita.
           Mobile (<768px): empilhado, capa em cima. */
        .codex-blog[data-aparencia="1"] .cb-capa {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-bottom: 35px;
            padding: 0 10px;
        }

        .codex-blog[data-aparencia="1"] .cb-capa-imagem {
            width: 100%;
            max-width: 200px;
            height: auto;
            border: 1px solid var(--cb-borda);
            border-radius: 4px;
            align-self: center;
            flex-shrink: 0;
        }

        .codex-blog[data-aparencia="1"] .cb-capa-texto {
            flex: 1;
            min-width: 0;
            color: var(--cb-text);
            font-size: 1.05rem;
            line-height: 1.8;
            text-align: justify;
        }

        @media (min-width: 769px) {
            .codex-blog[data-aparencia="1"] .cb-capa {
                flex-direction: row;
                align-items: flex-start;
            }

            .codex-blog[data-aparencia="1"] .cb-capa-imagem {
                align-self: flex-start;
            }
        }

    
    </style>
    <style>
        /* APARÊNCIA 2 — LINHA DO TEMPO.
           Usa o mesmo conteúdo e motor; não altera a aparência 1.
           --lt-* são medidas visuais locais, sem gravação no navegador. */
        .codex-blog[data-aparencia="2"] {
            --cb-bg: var(--bg, #fff); --cb-text: var(--text, #1a1a1a);
            --cb-borda: var(--borda, #ccc); --cb-muted: #666;
            font-family: Georgia, 'Times New Roman', serif;
            color: var(--cb-text); line-height: 1.9;
        }
        html.tema-escuro .codex-blog[data-aparencia="2"] { --cb-muted: #b5b5b5; }
        .codex-blog[data-aparencia="2"] .cb-container { max-width: 720px; margin: auto; padding: 0; }
        .codex-blog[data-aparencia="2"] .cb-assunto { position: relative; margin-bottom: 35px; --lt-progresso: 0; }
        .codex-blog[data-aparencia="2"] .cb-titulo { margin: 0 0 28px; padding: 12px 0; font-size: clamp(1.8rem, 5vw, 2.8rem); line-height: 1.25; letter-spacing: -.025em; }
        .codex-blog[data-aparencia="2"] .cb-capa { display: flex; gap: 24px; align-items: flex-start; margin-bottom: 40px; }
        .codex-blog[data-aparencia="2"] .cb-capa-imagem { display: block; width: 160px; max-width: 100%; height: auto; flex-shrink: 0; border: 1px solid var(--cb-borda); border-radius: 4px; }
        .codex-blog[data-aparencia="2"] .cb-capa-texto { flex: 1; min-width: 0; font-size: 1.05rem; }
        .codex-blog[data-aparencia="2"] .cb-capa-texto p { margin: 0 0 16px; }
        .codex-blog[data-aparencia="2"] .cb-assunto::before,
        .codex-blog[data-aparencia="2"] .cb-assunto::after {
            content: ''; position: absolute; left: 14px; top: var(--lt-inicio, 0px);
            height: var(--lt-altura, 0px); width: 1px; background: var(--cb-borda); pointer-events: none;
        }
        .codex-blog[data-aparencia="2"] .cb-assunto::after { width: 2px; background: var(--cb-text); transform-origin: top; transform: scaleY(var(--lt-progresso)); }
        .codex-blog[data-aparencia="2"] .cb-topico { position: relative; margin: 0; padding: 0 0 42px 52px; border: 0; background: transparent; }
        .codex-blog[data-aparencia="2"] .cb-topico:nth-of-type(even) { padding-left: 74px; }
        .codex-blog[data-aparencia="2"] .cb-topico:last-child { padding-bottom: 20px; }
        .codex-blog[data-aparencia="2"] .cb-topico::before {
            content: ''; position: absolute; left: 6px; top: 16px; z-index: 1;
            box-sizing: border-box; width: 17px; height: 17px; border: 1px solid #777; border-radius: 50%;
            background: linear-gradient(135deg, #fafafa, #888, #ddd); box-shadow: 0 0 0 5px var(--cb-bg);
            transition: transform .25s ease, background .25s ease;
        }
        .codex-blog[data-aparencia="2"] .cb-topico::after { content: ''; position: absolute; top: 24px; left: 26px; width: 15px; height: 1px; background: var(--cb-borda); }
        .codex-blog[data-aparencia="2"] .cb-topico:nth-of-type(even)::after { width: 37px; }
        .codex-blog[data-aparencia="2"] .cb-topico.lt-actual::before,
        .codex-blog[data-aparencia="2"] .cb-topico.expandido::before { background: var(--cb-text); border-color: var(--cb-text); transform: scale(1.1); }
        .codex-blog[data-aparencia="2"] .cb-topico-btn {
            display: block; width: 100%; min-height: 48px; padding: 8px 28px 8px 0;
            position: relative; border: 0; background: transparent; color: var(--cb-text);
            text-align: left; font: inherit; font-size: clamp(1.1rem, 3vw, 1.35rem); line-height: 1.5; cursor: pointer;
        }
        .codex-blog[data-aparencia="2"] .cb-topico-btn::after { content: '+'; position: absolute; right: 0; top: 8px; font-size: 20px; }
        .codex-blog[data-aparencia="2"] .cb-topico.expandido .cb-topico-btn::after { content: '−'; }
        .codex-blog[data-aparencia="2"] .cb-topico-btn:hover { text-decoration: underline; text-underline-offset: 5px; }
        .codex-blog[data-aparencia="2"] :focus-visible { outline: 2px solid var(--cb-text); outline-offset: 4px; }
        .codex-blog[data-aparencia="2"] .cb-topico > p { margin: 12px 0 18px; }
        .codex-blog[data-aparencia="2"] .cb-topico-conteudo { display: none; padding: 18px 0 0; color: var(--cb-text); }
        .codex-blog[data-aparencia="2"] .cb-topico.expandido .cb-topico-conteudo { display: block; }
        .codex-blog[data-aparencia="2"] .cb-topico-conteudo p { margin: 0 0 18px; font-size: 1.05rem; line-height: 1.95; }
        .codex-blog[data-aparencia="2"] .cb-topico-conteudo h1,
        .codex-blog[data-aparencia="2"] .cb-topico-conteudo h2,
        .codex-blog[data-aparencia="2"] .cb-topico-conteudo h3 { margin: 20px 0 10px; color: var(--cb-text); }
        .codex-blog[data-aparencia="2"] .cb-topico-conteudo img { max-width: 100%; height: auto; margin: 15px 0; border: 1px solid var(--cb-borda); border-radius: 4px; }
        .codex-blog[data-aparencia="2"] .cb-carregando { margin: 0; padding: 8px 0; font-style: italic; color: var(--cb-muted); }
        @media (max-width: 600px) {
            .codex-blog[data-aparencia="2"] .cb-capa { flex-direction: column; gap: 18px; }
            .codex-blog[data-aparencia="2"] .cb-capa-imagem { align-self: center; }
            .codex-blog[data-aparencia="2"] .cb-assunto::before,
            .codex-blog[data-aparencia="2"] .cb-assunto::after { left: 7px; }
            .codex-blog[data-aparencia="2"] .cb-topico,
            .codex-blog[data-aparencia="2"] .cb-topico:nth-of-type(even) { padding-left: 32px; padding-bottom: 32px; }
            .codex-blog[data-aparencia="2"] .cb-topico::before { left: 0; width: 15px; height: 15px; }
            .codex-blog[data-aparencia="2"] .cb-topico::after,
            .codex-blog[data-aparencia="2"] .cb-topico:nth-of-type(even)::after { left: 20px; width: 6px; top: 23px; }
        }
        @media (prefers-reduced-motion: reduce) {
            .codex-blog[data-aparencia="2"] .cb-topico::before { transition: none; }
        }
    </style>
    <style>/* APARÊNCIA 3 — CSS reservado. */</style>
    <!-- BLOCO 2 — CONTEÚDO: editar título, capa, sinopse e capítulos. -->
    <div class="cb-container">

        <div class="cb-assunto">
            <div class="cb-titulo">CODEX THEOLOGIA</div>

            <!-- ============================================================
                 CAPA + SINOPSE
                 ============================================================
                 Bloco fixo, exibido uma vez, abaixo do título do livro e
                 acima da lista de capítulos deste .cb-assunto.

                 MANUTENÇÃO:
                   • Imagem : alterar o src de .cb-capa-imagem
                   • Texto  : editar o(s) parágrafo(s) dentro de .cb-capa-texto
                 ============================================================ -->
            

            <div class="cb-topico" data-arquivo="ORIGINAIS_REGNUM_FLORESTA/DIA1.html" data-conquista="REGN-FLO-01">
                <button class="cb-topico-btn" aria-expanded="false">
                    DIA I: SONITUS DESERTI
                </button>
                <div class="cb-topico-conteudo" role="region" aria-hidden="true"></div>
            </div>
            <div class="cb-topico" data-arquivo="ORIGINAIS_REGNUM_FLORESTA/DIA2.html" data-conquista="REGN-FLO-02">
                <button class="cb-topico-btn" aria-expanded="false">
                    DIA II: OBSESSIO
                </button>
                <div class="cb-topico-conteudo" role="region" aria-hidden="true"></div>
            </div>
			<div class="cb-topico" data-arquivo="ORIGINAIS_REGNUM_FLORESTA/DIA3.html" data-conquista="REGN-FLO-03">
                <button class="cb-topico-btn" aria-expanded="false">
                    DIA III: PERTURBATIO ANIMI
                </button>
                <div class="cb-topico-conteudo" role="region" aria-hidden="true"></div>
            </div>
			<div class="cb-topico" data-arquivo="ORIGINAIS_REGNUM_FLORESTA/DIA4.html" data-conquista="REGN-FLO-04">
                <button class="cb-topico-btn" aria-expanded="false">
                    DIA IV: IN ALBO
                </button>
                <div class="cb-topico-conteudo" role="region" aria-hidden="true"></div>
            </div>
			<div class="cb-topico" data-arquivo="ORIGINAIS_REGNUM_FLORESTA/DIA5.html" data-conquista="REGN-FLO-05">
                <button class="cb-topico-btn" aria-expanded="false">
                    DIA V: UMBRA ÆTERNA
                </button>
                <div class="cb-topico-conteudo" role="region" aria-hidden="true"></div>
            </div>

        </div><!-- /.cb-assunto -->

    </div><!-- /.cb-container -->



    <script>
(function () {
    'use strict';

    // ================================================================
    // BLOCO 3 — FUNCIONAMENTO DA APARÊNCIA 1: ACORDEÃO
    // As futuras aparências usam os mesmos métodos: preparar, fechar,
    // abrir e posicionar. O motor de leitura fica no bloco seguinte.
    // ================================================================
    var APARENCIAS = {
        1: {
            fechar: function (raiz) {
                raiz.querySelectorAll('.cb-topico').forEach(function (t) {
                    t.classList.remove('expandido');
                    t.querySelector('.cb-topico-btn').setAttribute('aria-expanded', 'false');
                    t.querySelector('.cb-topico-conteudo').setAttribute('aria-hidden', 'true');
                });
            },
            abrir: function (topico, btn, painel) {
                topico.classList.add('expandido');
                btn.setAttribute('aria-expanded', 'true');
                painel.setAttribute('aria-hidden', 'false');
            },
            posicionar: function (btn) {
                var reduzir = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
                var topo = Math.max(0, window.scrollY + btn.getBoundingClientRect().top - 16);
                window.scrollTo({ top: topo, behavior: reduzir ? 'instant' : 'smooth' });
            }
        },
        // APARÊNCIA 2 — LINHA DO TEMPO.
        2: {
            // Somente efeitos da aparência 2; o motor de leitura fica intocado.
            preparar: function (raiz) {
                var grupos = Array.from(raiz.querySelectorAll('.cb-assunto')).map(function (grupo) {
                    return { grupo: grupo, pontos: Array.from(grupo.children).filter(function (el) {
                        return el.classList.contains('cb-topico');
                    }) };
                }).filter(function (item) { return item.pontos.length > 0; });
                var quadro = null;
                var observadorTamanho = null;
                function limpar() {
                    window.removeEventListener('scroll', agendar);
                    window.removeEventListener('resize', agendar);
                    window.removeEventListener('site:capitulo-aberto', aoAbrir);
                    raiz.removeEventListener('click', agendar);
                    raiz.removeEventListener('load', agendar, true);
                    raiz.removeEventListener('error', agendar, true);
                    if (quadro !== null) cancelAnimationFrame(quadro);
                    if (observadorTamanho) observadorTamanho.disconnect();
                    observador.disconnect();
                }
                function atualizar() {
                    quadro = null;
                    if (!raiz.isConnected) { limpar(); return; }
                    var guia = window.innerHeight * .4;
                    grupos.forEach(function (item) {
                        var caixa = item.grupo.getBoundingClientRect();
                        var primeiro = item.pontos[0].getBoundingClientRect();
                        var ultimo = item.pontos[item.pontos.length-1].getBoundingClientRect();
                        var inicio = primeiro.top-caixa.top+24;
                        var altura = Math.max(0, ultimo.bottom-caixa.top-inicio-12);
                        item.grupo.style.setProperty('--lt-inicio', inicio+'px');
                        item.grupo.style.setProperty('--lt-altura', altura+'px');
                        item.grupo.style.setProperty('--lt-progresso', Math.max(0, Math.min(1, (guia-primeiro.top-24)/Math.max(1, altura))));
                        var actual = item.pontos[0];
                        item.pontos.forEach(function (ponto) { if (ponto.getBoundingClientRect().top <= guia) actual = ponto; });
                        item.pontos.forEach(function (ponto) { ponto.classList.toggle('lt-actual', ponto === actual); });
                    });
                }
                function agendar() { if (quadro === null) quadro = requestAnimationFrame(atualizar); }
                function aoAbrir(evento) {
                    if (evento.detail && evento.detail.topico && raiz.contains(evento.detail.topico)) agendar();
                }
                var observador = new MutationObserver(function () {
                    if (!raiz.isConnected) limpar(); else agendar();
                });
                observador.observe(document.body, { childList: true, subtree: true });
                if (typeof ResizeObserver === 'function') {
                    observadorTamanho = new ResizeObserver(agendar);
                    observadorTamanho.observe(raiz);
                }
                window.addEventListener('scroll', agendar, { passive: true });
                window.addEventListener('resize', agendar);
                window.addEventListener('site:capitulo-aberto', aoAbrir);
                raiz.addEventListener('click', agendar);
                raiz.addEventListener('load', agendar, true);
                raiz.addEventListener('error', agendar, true);
                agendar();
            },
            fechar: function (raiz) { APARENCIAS[1].fechar(raiz); },
            abrir: function (topico, btn, painel) { APARENCIAS[1].abrir(topico, btn, painel); },
            posicionar: function (btn) { APARENCIAS[1].posicionar(btn); }
        },
        // APARÊNCIA 3 — substituir null pelo objecto quando desenvolvido.
        3: null
    };

    // ================================================================
    // BLOCO 4 — CHAMADAS DOS SISTEMAS LUMINA
    // Scripts são carregados apenas com a opção correspondente em 1.
    // Cache no elemento script evita repetir a carga entre Codex.
    // Nenhuma gravação em localStorage é feita neste bloco.
    // ================================================================
    function carregarScript(arquivo) {
        var existente = Array.from(document.querySelectorAll('script[data-lumina-arquivo]'))
            .find(function (s) { return s.dataset.luminaArquivo === arquivo; });
        if (existente) return existente.luminaPronto;

        var script = document.createElement('script');
        script.src = arquivo;
        script.dataset.luminaArquivo = arquivo;
        script.luminaPronto = new Promise(function (resolve) {
            var timer = setTimeout(function () { terminar(false); }, 15000);
            function terminar(ok) {
                clearTimeout(timer);
                script.onload = script.onerror = null;
                if (!ok) {
                    script.remove();
                    console.warn('[CODEX ZERO] Sistema indisponível:', arquivo);
                }
                resolve(ok);
            }
            script.onload = function () { terminar(true); };
            script.onerror = function () { terminar(false); };
        });
        document.head.appendChild(script);
        return script.luminaPronto;
    }

    // ================================================================
    // BLOCO 5 — MOTOR COMUM DE LEITURA
    // Preserva o contrato de ULTIMO_CODEX: abrirCapitulo() retorna
    // Promise; site:capitulo-aberto confirma somente o sucesso.
    // ================================================================
    function initCodexZero() {
        var raiz = document.querySelector('.codex-blog[data-codex-zero]');
        if (!raiz || raiz.dataset.iniciado === 'true') return;
        raiz.dataset.iniciado = 'true';

        var visual = APARENCIAS[raiz.dataset.aparencia];
        if (!visual) {
            raiz.dataset.aparencia = '1';
            visual = APARENCIAS[1];
        }
        var conquistas = raiz.dataset.conquistas === '1';
        var leitor = raiz.dataset.leitor === '1';
        var escolha = 0;
        var quadroRolagem = null;
        if (visual.preparar) visual.preparar(raiz);

        var conquistasProntas = conquistas
            ? carregarScript('SISTEMA_LUMINA_CONQUISTAS_LISTA.js').then(function (ok) {
                return ok ? carregarScript('SISTEMA_LUMINA_CONQUISTAS.js') : false;
            }) : Promise.resolve(false);
        var leitorPronto = leitor
            ? carregarScript('SISTEMA_LUMINA_LEITOR.js') : Promise.resolve(false);

        function confirmarSistemas(topico, numero) {
            var id = topico.getAttribute('data-conquista');
            function atual() {
                return raiz.isConnected && numero === escolha &&
                    topico.classList.contains('expandido');
            }
            conquistasProntas.then(function (ok) {
                if (!ok || !atual() || !id || !window.ConquistasSistema) return;
                try {
                    window.ConquistasSistema.desbloquear(id);
                } catch (erro) { console.warn('[CONQUISTAS]', erro); }
            });
            leitorPronto.then(function (ok) {
                if (!ok || !atual()) return;
                // Contrato preparado para o futuro SISTEMA_LUMINA_LEITOR.js.
                window.dispatchEvent(new CustomEvent('site:lumina-leitura', {
                    detail: {
                        id: id,
                        arquivo: topico.getAttribute('data-arquivo'),
                        titulo: topico.querySelector('.cb-topico-btn').textContent.trim(),
                        topico: topico,
                        raiz: raiz
                    }
                }));
            });
        }

        raiz.querySelectorAll('.cb-topico-btn').forEach(function (btn) {
            btn.dataset.iniciado = 'true';
            var topico = btn.closest('.cb-topico');
            var painel = topico.querySelector('.cb-topico-conteudo');
            var pendente = null;

            btn.abrirCapitulo = async function () {
                var numero = ++escolha;
                if (quadroRolagem !== null) cancelAnimationFrame(quadroRolagem);
                visual.fechar(raiz);
                visual.abrir(topico, btn, painel);
                try {
                    if (painel.dataset.carregado !== 'true') {
                        if (!pendente) {
                            pendente = carregarConteudo(topico.getAttribute('data-arquivo'), painel)
                                .finally(function () { pendente = null; });
                        }
                        await pendente;
                    }
                    if (!raiz.isConnected || numero !== escolha) return;
                    window.dispatchEvent(new CustomEvent('site:capitulo-aberto', {
                        detail: { arquivo: topico.getAttribute('data-arquivo'), topico: topico }
                    }));
                    confirmarSistemas(topico, numero);
                    // Aguarda o layout aberto; a última escolha prevalece.
                    quadroRolagem = requestAnimationFrame(function () {
                        quadroRolagem = null;
                        if (raiz.isConnected && numero === escolha) visual.posicionar(btn);
                    });
                } catch (erro) {
                    if (raiz.isConnected && numero === escolha) {
                        painel.innerHTML = '<p>Conteúdo não disponível.</p>';
                    }
                    throw erro;
                }
            };

            btn.addEventListener('click', function () {
                if (topico.classList.contains('expandido')) {
                    ++escolha;
                    if (quadroRolagem !== null) cancelAnimationFrame(quadroRolagem);
                    visual.fechar(raiz);
                    return;
                }
                btn.abrirCapitulo().catch(function (erro) {
                    console.warn('[CODEX ZERO]', erro);
                    if (raiz.isConnected && topico.classList.contains('expandido') &&
                        typeof window.injectarCodex === 'function') {
                        window.injectarCodex('CODEX_ALPHA.html');
                    }
                });
            });
        });
    }

    async function carregarConteudo(arquivo, painel) {
        var controller = new AbortController();
        var timer = setTimeout(function () { controller.abort(); }, 15000);
        painel.innerHTML = '<p class="cb-carregando">A carregar…</p>';
        try {
            var resposta = await fetch(arquivo, { signal: controller.signal });
            if (!resposta.ok) throw new Error('Ficheiro não encontrado: ' + arquivo);
            var html = await resposta.text();
            if (!html.trim()) throw new Error('Capítulo vazio: ' + arquivo);
            // Scripts dos capítulos ficam inertes, preservando o acesso avulso.
            painel.innerHTML = html;
            painel.dataset.carregado = 'true';
        } catch (erro) {
            delete painel.dataset.carregado;
            throw erro;
        } finally { clearTimeout(timer); }
    }

    window.initCodexZero = initCodexZero;
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initCodexZero);
    } else { initCodexZero(); }
}());

    </script>
</div>
